<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Block | Base Explorer</title>

    <meta
        name="description"
        content="View Base Mainnet block details, transactions, gas usage, validator information and block data."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <link rel="stylesheet" href="global.css">

    <style>

        /* =================================================
           PAGE CONTAINER
        ================================================= */

        .container {
            width: min(1200px, 94%);

            margin: 0 auto 60px;
        }


        /* =================================================
           BREADCRUMB
        ================================================= */

        .breadcrumb {
            padding: 25px 0 16px;

            color: #6b7280;

            font-size: 13px;
        }

        .breadcrumb a {
            color: #0052ff;

            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }


        /* =================================================
           CARD
        ================================================= */

        .card {
            background: #ffffff;

            border: 1px solid #e5e7eb;

            border-radius: 10px;

            margin-bottom: 18px;

            overflow: hidden;
        }

        .card-header {
            min-height: 56px;

            padding: 0 18px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border-bottom: 1px solid #eef0f3;

            font-size: 15px;

            font-weight: 700;
        }

        .card-body {
            padding: 20px;
        }


        /* =================================================
           BLOCK HEADER
        ================================================= */

        .block-summary {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;
        }

        .block-number {
            margin-bottom: 9px;

            color: #111827;

            font-size: 26px;

            line-height: 1.2;

            font-weight: 700;

            letter-spacing: -0.5px;
        }

        .block-label {
            margin-bottom: 5px;

            color: #6b7280;

            font-size: 11px;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: 0.3px;
        }


        /* =================================================
           NETWORK BADGE
        ================================================= */

        .network-badge {
            display: inline-flex;

            align-items: center;

            gap: 6px;

            padding: 5px 9px;

            background: #ecfdf5;

            color: #15803d;

            border-radius: 999px;

            font-size: 11px;

            font-weight: 600;

            white-space: nowrap;
        }


        /* =================================================
           DETAILS
        ================================================= */

        .details {
            display: grid;

            grid-template-columns: 200px 1fr;
        }

        .detail-label {
            padding: 14px 18px;

            background: #fafafa;

            border-bottom: 1px solid #f0f1f3;

            color: #6b7280;

            font-size: 12px;

            font-weight: 500;
        }

        .detail-value {
            min-width: 0;

            padding: 14px 18px;

            border-bottom: 1px solid #f0f1f3;

            color: #111827;

            font-size: 12px;

            word-break: break-word;
        }

        .hash {
            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;

            word-break: break-all;
        }

        .detail-value a {
            color: #0052ff;

            text-decoration: none;

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;
        }

        .detail-value a:hover {
            text-decoration: underline;
        }


        /* =================================================
           TABLE
        ================================================= */

        .table-wrapper {
            width: 100%;

            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px 18px;

            text-align: left;

            border-bottom: 1px solid #f0f1f3;

            font-size: 12px;

            white-space: nowrap;
        }

        th {
            background: #fafafa;

            color: #6b7280;

            font-size: 11px;

            font-weight: 600;
        }

        tbody tr:hover {
            background: #f8faff;
        }

        td a {
            color: #0052ff;

            text-decoration: none;

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;
        }

        td a:hover {
            text-decoration: underline;
        }


        /* =================================================
           STATUS
        ================================================= */

        .status {
            color: #15803d;

            font-weight: 600;
        }

        .status.failed {
            color: #dc2626;
        }


        /* =================================================
           LOADING / ERROR / EMPTY
        ================================================= */

        .loading {
            padding: 45px 20px;

            text-align: center;

            color: #9ca3af;

            font-size: 13px;
        }

        .error {
            padding: 18px;

            background: #fef2f2;

            color: #dc2626;

            border-radius: 8px;

            text-align: center;

            font-size: 13px;
        }

        .empty {
            padding: 40px 20px;

            text-align: center;

            color: #9ca3af;

            font-size: 13px;
        }


        /* =================================================
           EXTERNAL LINK
        ================================================= */

        .external-link {
            display: inline-flex;

            align-items: center;

            padding: 9px 13px;

            background: #0052ff;

            color: #ffffff;

            text-decoration: none;

            border-radius: 7px;

            font-size: 12px;

            font-weight: 600;
        }

        .external-link:hover {
            background: #0047df;
        }


        /* =================================================
           RESPONSIVE
        ================================================= */

        @media (max-width: 650px) {

            .container {
                width: 94%;
            }

            .breadcrumb {
                padding-top: 18px;
            }

            .card-body {
                padding: 16px;
            }

            .block-summary {
                align-items: flex-start;

                flex-direction: column;

                gap: 12px;
            }

            .block-number {
                font-size: 23px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .detail-label {
                padding: 11px 14px 4px;

                border-bottom: none;

                background: #ffffff;
            }

            .detail-value {
                padding: 4px 14px 11px;
            }

            th,
            td {
                padding: 12px 14px;

                font-size: 11px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     UNIVERSAL HEADER
===================================================== -->

<div id="siteHeader"></div>


<main class="container">


    <!-- =================================================
         BREADCRUMB
    ================================================= -->

    <div class="breadcrumb">

        <a href="index.html">
            Home
        </a>

        /

        Block

    </div>


    <!-- =================================================
         BLOCK CONTAINER
    ================================================= -->

    <div id="blockContainer">

        <div class="loading">
            Loading block...
        </div>

    </div>


</main>


<!-- =====================================================
     UNIVERSAL FOOTER
===================================================== -->

<div id="siteFooter"></div>


<!-- =====================================================
     UNIVERSAL SITE JS
===================================================== -->

<script src="site.js"></script>


<script>

    /* =========================================================
       CONFIG
    ========================================================= */

    const BLOCKSCOUT_API =
        "https://base.blockscout.com/api/v2";


    /* =========================================================
       GET BLOCK FROM URL
    ========================================================= */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const blockParam =
        params.get("block");


    /* =========================================================
       VALIDATE BLOCK
    ========================================================= */

    function isValidBlock(value) {

        return /^\d+$/.test(
            value || ""
        );

    }


    /* =========================================================
       FORMAT NUMBER
    ========================================================= */

    function formatNumber(value) {

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {
            return "-";
        }

        try {

            return Number(value)
                .toLocaleString();

        } catch {

            return String(value);

        }

    }


    /* =========================================================
       SHORT HASH
    ========================================================= */

    function shortHash(value) {

        if (!value) {
            return "-";
        }

        return (
            value.substring(0, 14) +
            "..." +
            value.substring(
                value.length - 10
            )
        );

    }


    /* =========================================================
       FORMAT GWEI
    ========================================================= */

    function formatGwei(value) {

        try {

            const wei =
                BigInt(value || "0");

            const whole =
                wei / 1000000000n;

            const fraction =
                wei % 1000000000n;

            const fractionText =
                fraction
                    .toString()
                    .padStart(9, "0")
                    .substring(0, 6);

            return (
                whole.toString() +
                "." +
                fractionText +
                " Gwei"
            );

        } catch {

            return "-";

        }

    }


    /* =========================================================
       FORMAT ETH
    ========================================================= */

    function formatETH(value) {

        try {

            const wei =
                BigInt(value || "0");

            const whole =
                wei / 1000000000000000000n;

            const fraction =
                wei % 1000000000000000000n;

            const fractionText =
                fraction
                    .toString()
                    .padStart(18, "0")
                    .substring(0, 6);

            return (
                whole.toString() +
                "." +
                fractionText +
                " ETH"
            );

        } catch {

            return "0.000000 ETH";

        }

    }


    /* =========================================================
       LOAD BLOCK
    ========================================================= */

    async function loadBlock() {

        const container =
            document.getElementById(
                "blockContainer"
            );


        if (
            !blockParam ||
            !isValidBlock(blockParam)
        ) {

            container.innerHTML = `

                <div class="error">

                    Invalid block number.

                </div>

            `;

            return;

        }


        try {

            const response =
                await fetch(
                    BLOCKSCOUT_API +
                    "/blocks/" +
                    encodeURIComponent(
                        blockParam
                    )
                );


            if (!response.ok) {

                throw new Error(
                    "Block not found"
                );

            }


            const block =
                await response.json();


            displayBlock(block);


        } catch (error) {

            console.error(
                "Block loading error:",
                error
            );


            container.innerHTML = `

                <div class="error">

                    Unable to load this block.

                    <br><br>

                    Please check the block number
                    and try again.

                </div>

            `;

        }

    }


    /* =========================================================
       DISPLAY BLOCK
    ========================================================= */

    function displayBlock(block) {

        const container =
            document.getElementById(
                "blockContainer"
            );


        const height =
            block.height ??
            block.number ??
            blockParam;


        const timestamp =
            block.timestamp
                ? new Date(
                    block.timestamp
                ).toLocaleString()
                : "-";


        const blockHash =
            block.hash || "-";


        const parentHash =
            block.parent_hash || "-";


        const miner =
            block.miner?.hash || "";


        const gasUsed =
            block.gas_used ?? 0;


        const gasLimit =
            block.gas_limit ?? 0;


        const transactionCount =
            block.transaction_count ??
            block.tx_count ??
            0;


        const baseFee =
            block.base_fee_per_gas
                ? formatGwei(
                    block.base_fee_per_gas
                )
                : "-";


        container.innerHTML = `

            <!-- BLOCK DETAILS -->

            <div class="card">

                <div class="card-header">

                    <span>
                        Block Details
                    </span>

                    <span class="network-badge">
                        ● Base Mainnet
                    </span>

                </div>


                <div class="card-body">

                    <div class="block-label">
                        Block
                    </div>

                    <div class="block-number">

                        #${formatNumber(height)}

                    </div>

                </div>


                <div class="details">


                    <div class="detail-label">
                        Block Hash
                    </div>

                    <div class="detail-value hash">

                        ${blockHash}

                    </div>


                    <div class="detail-label">
                        Parent Hash
                    </div>

                    <div class="detail-value hash">

                        ${parentHash}

                    </div>


                    <div class="detail-label">
                        Timestamp
                    </div>

                    <div class="detail-value">

                        ${timestamp}

                    </div>


                    <div class="detail-label">
                        Validator / Miner
                    </div>

                    <div class="detail-value">

                        ${
                            miner
                                ? `
                                    <a
                                        href="address.html?address=${encodeURIComponent(miner)}"
                                    >
                                        ${shortHash(miner)}
                                    </a>
                                `
                                : "-"
                        }

                    </div>


                    <div class="detail-label">
                        Transactions
                    </div>

                    <div class="detail-value">

                        ${formatNumber(transactionCount)}

                    </div>


                    <div class="detail-label">
                        Gas Used
                    </div>

                    <div class="detail-value">

                        ${formatNumber(gasUsed)}

                    </div>


                    <div class="detail-label">
                        Gas Limit
                    </div>

                    <div class="detail-value">

                        ${formatNumber(gasLimit)}

                    </div>


                    <div class="detail-label">
                        Base Fee
                    </div>

                    <div class="detail-value">

                        ${baseFee}

                    </div>


                </div>

            </div>


            <!-- TRANSACTIONS -->

            <div class="card">

                <div class="card-header">

                    <span>
                        Transactions
                    </span>

                    <span style="
                        color:#9ca3af;
                        font-size:11px;
                        font-weight:500;
                    ">
                        ${formatNumber(transactionCount)} total
                    </span>

                </div>


                <div id="transactions">

                    <div class="loading">

                        Loading transactions...

                    </div>

                </div>

            </div>


            <!-- EXPLORER LINKS -->

            <div class="card">

                <div class="card-header">

                    Explorer Links

                </div>


                <div class="card-body">

                    <a
                        id="basescanLink"
                        class="external-link"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        View on BaseScan →

                    </a>

                </div>

            </div>

        `;


        document.getElementById(
            "basescanLink"
        ).href =
            "https://basescan.org/block/" +
            encodeURIComponent(
                blockParam
            );


        loadBlockTransactions();

    }


    /* =========================================================
       BLOCK TRANSACTIONS
    ========================================================= */

    async function loadBlockTransactions() {

        const container =
            document.getElementById(
                "transactions"
            );


        if (!container) {
            return;
        }


        try {

            const response =
                await fetch(
                    BLOCKSCOUT_API +
                    "/blocks/" +
                    encodeURIComponent(
                        blockParam
                    ) +
                    "/transactions"
                );


            if (!response.ok) {

                throw new Error(
                    "Transactions unavailable"
                );

            }


            const data =
                await response.json();


            const transactions =
                data.items || [];


            if (
                transactions.length === 0
            ) {

                container.innerHTML = `

                    <div class="empty">

                        No transactions found.

                    </div>

                `;

                return;

            }


            let html = `

                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    Transaction
                                </th>

                                <th>
                                    From
                                </th>

                                <th>
                                    To
                                </th>

                                <th>
                                    Value
                                </th>

                                <th>
                                    Status
                                </th>

                            </tr>

                        </thead>

                        <tbody>

            `;


            transactions.forEach(
                tx => {

                    const hash =
                        tx.hash || "";


                    const from =
                        tx.from?.hash || "";


                    const to =
                        tx.to?.hash || "";


                    const value =
                        formatETH(
                            tx.value
                        );


                    const isSuccess =
                        tx.status === "ok";


                    const status =
                        isSuccess
                            ? "Success"
                            : "Failed";


                    html += `

                        <tr>


                            <td>

                                ${
                                    hash
                                        ? `
                                            <a
                                                href="tx.html?hash=${encodeURIComponent(hash)}"
                                                title="${hash}"
                                            >
                                                ${shortHash(hash)}
                                            </a>
                                        `
                                        : "-"
                                }

                            </td>


                            <td>

                                ${
                                    from
                                        ? `
                                            <a
                                                href="address.html?address=${encodeURIComponent(from)}"
                                                title="${from}"
                                            >
                                                ${shortHash(from)}
                                            </a>
                                        `
                                        : "-"
                                }

                            </td>


                            <td>

                                ${
                                    to
                                        ? `
                                            <a
                                                href="address.html?address=${encodeURIComponent(to)}"
                                                title="${to}"
                                            >
                                                ${shortHash(to)}
                                            </a>
                                        `
                                        : "-"
                                }

                            </td>


                            <td>

                                ${value}

                            </td>


                            <td>

                                <span
                                    class="${isSuccess ? "status" : "status failed"}"
                                >

                                    ${status}

                                </span>

                            </td>


                        </tr>

                    `;

                }
            );


            html += `

                        </tbody>

                    </table>

                </div>

            `;


            container.innerHTML =
                html;


        } catch (error) {

            console.error(
                "Block transactions error:",
                error
            );


            container.innerHTML = `

                <div class="empty">

                    Unable to load block transactions.

                    <br><br>

                    Please try again later.

                </div>

            `;

        }

    }


    /* =========================================================
       START
    ========================================================= */

    loadBlock();

</script>


</body>

</html>
