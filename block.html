<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Block | Base Explorer</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f6f8fb;
            color: #1f2937;
        }

        header {
            height: 64px;
            background: white;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
        }

        .header-inner {
            width: min(1200px, 94%);
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            text-decoration: none;
            color: #111827;

            font-size: 19px;
            font-weight: 700;
        }

        .logo-icon {
            width: 34px;
            height: 34px;

            border-radius: 9px;

            background: #0052ff;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 22px;
        }

        nav a {
            text-decoration: none;
            color: #4b5563;
            font-size: 14px;
        }

        nav a:hover {
            color: #0052ff;
        }

        .container {
            width: min(1200px, 94%);
            margin: 30px auto 60px;
        }

        .breadcrumb {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 15px;
        }

        .breadcrumb a {
            color: #0052ff;
            text-decoration: none;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .card-header {
            padding: 18px 20px;
            border-bottom: 1px solid #e5e7eb;

            font-size: 17px;
            font-weight: 700;
        }

        .card-body {
            padding: 20px;
        }

        .block-number {
            font-size: 25px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .network-badge {
            display: inline-block;

            background: #ecfdf5;
            color: #15803d;

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 12px;
            font-weight: 600;
        }

        .details {
            display: grid;
            grid-template-columns: 220px 1fr;
        }

        .detail-label {
            padding: 16px 20px;

            background: #fafafa;

            border-bottom: 1px solid #f0f1f3;

            color: #6b7280;

            font-size: 13px;
        }

        .detail-value {
            padding: 16px 20px;

            border-bottom: 1px solid #f0f1f3;

            font-size: 13px;

            word-break: break-all;
        }

        .hash {
            font-family: monospace;
        }

        .detail-value a {
            color: #0052ff;
            text-decoration: none;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px 20px;

            text-align: left;

            border-bottom: 1px solid #f0f1f3;

            font-size: 13px;

            white-space: nowrap;
        }

        th {
            color: #6b7280;
            background: #fafafa;
        }

        td a {
            color: #0052ff;
            text-decoration: none;
            font-family: monospace;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #9ca3af;
        }

        .error {
            background: #fef2f2;
            color: #dc2626;

            padding: 20px;

            border-radius: 10px;

            text-align: center;
        }

        .empty {
            padding: 40px;
            text-align: center;
            color: #9ca3af;
        }

        .external-link {
            display: inline-block;

            padding: 10px 14px;

            background: #0052ff;
            color: white;

            text-decoration: none;

            border-radius: 7px;

            font-size: 13px;
        }

        footer {
            background: white;

            border-top: 1px solid #e5e7eb;

            padding: 25px;

            text-align: center;

            color: #6b7280;

            font-size: 13px;
        }

        @media (max-width: 768px) {

            nav {
                display: none;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .detail-label {
                padding-bottom: 5px;
                border-bottom: none;
            }

            .detail-value {
                padding-top: 5px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-inner">

        <a href="index.html"
           class="logo">

            <div class="logo-icon">
                B
            </div>

            Base Explorer

        </a>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="#">
                Blockchain
            </a>

            <a href="#">
                Tokens
            </a>

            <a href="#">
                Contracts
            </a>

        </nav>

    </div>

</header>



<main class="container">


    <div class="breadcrumb">

        <a href="index.html">
            Home
        </a>

        /

        Block

    </div>



    <div
        id="blockContainer">

        <div class="loading">

            Loading block...

        </div>

    </div>



</main>



<footer>

    Base Explorer © 2026

</footer>



<script>


/* =========================================
   CONFIG
========================================= */

const BLOCKSCOUT_API =
    "https://base.blockscout.com/api/v2";


/* =========================================
   GET BLOCK FROM URL
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const blockParam =
    params.get("block");


/* =========================================
   VALIDATE BLOCK
========================================= */

function isValidBlock(value) {

    return /^\d+$/.test(value);

}


/* =========================================
   FORMAT NUMBER
========================================= */

function formatNumber(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "-";
    }

    return Number(value)
        .toLocaleString();

}


/* =========================================
   SHORT HASH
========================================= */

function shortHash(value) {

    if (!value) {
        return "-";
    }

    return (
        value.substring(0, 14)
        + "..."
        + value.substring(
            value.length - 10
        )
    );

}


/* =========================================
   LOAD BLOCK
========================================= */

async function loadBlock() {

    const container =
        document.getElementById(
            "blockContainer"
        );


    if (
        !blockParam ||
        !isValidBlock(blockParam)
    ) {

        container.innerHTML = `

            <div class="error">

                Invalid block number.

            </div>

        `;

        return;

    }


    try {

        const response =
            await fetch(

                BLOCKSCOUT_API
                + "/blocks/"
                + blockParam

            );


        if (!response.ok) {

            throw new Error(
                "Block not found"
            );

        }


        const block =
            await response.json();


        displayBlock(block);


    } catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="error">

                Unable to load this block.

                <br><br>

                Please check the block number.

            </div>

        `;

    }

}


/* =========================================
   DISPLAY BLOCK
========================================= */

function displayBlock(block) {

    const container =
        document.getElementById(
            "blockContainer"
        );


    const timestamp =
        block.timestamp
            ? new Date(
                block.timestamp
              ).toLocaleString()
            : "-";


    const blockHash =
        block.hash || "-";


    const parentHash =
        block.parent_hash || "-";


    const miner =
        block.miner?.hash || "-";


    const gasUsed =
        block.gas_used || 0;


    const gasLimit =
        block.gas_limit || 0;


    const transactionCount =
        block.transaction_count ??
        (
            block.tx_count ??
            "-"
        );


    container.innerHTML = `

        <div class="card">

            <div class="card-header">

                Block Details

            </div>


            <div class="card-body">

                <div class="block-number">

                    Block #${formatNumber(
                        block.height ??
                        block.number ??
                        blockParam
                    )}

                </div>


                <span
                    class="network-badge">

                    ● Base Mainnet

                </span>

            </div>


            <div class="details">


                <div class="detail-label">
                    Block Hash
                </div>

                <div
                    class="detail-value hash">

                    ${blockHash}

                </div>


                <div class="detail-label">
                    Parent Hash
                </div>

                <div
                    class="detail-value hash">

                    ${parentHash}

                </div>


                <div class="detail-label">
                    Timestamp
                </div>

                <div class="detail-value">

                    ${timestamp}

                </div>


                <div class="detail-label">
                    Validator / Miner
                </div>

                <div class="detail-value">

                    <a
                        href="address.html?address=${miner}">

                        ${shortHash(miner)}

                    </a>

                </div>


                <div class="detail-label">
                    Transactions
                </div>

                <div class="detail-value">

                    ${formatNumber(
                        transactionCount
                    )}

                </div>


                <div class="detail-label">
                    Gas Used
                </div>

                <div class="detail-value">

                    ${formatNumber(gasUsed)}

                </div>


                <div class="detail-label">
                    Gas Limit
                </div>

                <div class="detail-value">

                    ${formatNumber(gasLimit)}

                </div>


                <div class="detail-label">
                    Base Fee
                </div>

                <div class="detail-value">

                    ${
                        block.base_fee_per_gas
                            ? formatGwei(
                                block.base_fee_per_gas
                              )
                            : "-"
                    }

                </div>


            </div>

        </div>



        <div class="card">

            <div class="card-header">

                Transactions

            </div>


            <div id="transactions">

                <div class="loading">

                    Loading transactions...

                </div>

            </div>

        </div>



        <div class="card">

            <div class="card-header">

                Explorer Links

            </div>


            <div class="card-body">

                <a
                    class="external-link"
                    href="https://basescan.org/block/${blockParam}"
                    target="_blank">

                    View on BaseScan →

                </a>

            </div>

        </div>

    `;


    loadBlockTransactions();

}


/* =========================================
   GWEI
========================================= */

function formatGwei(value) {

    try {

        const gwei =
            Number(value) / 1e9;

        return gwei.toLocaleString(
            undefined,
            {
                maximumFractionDigits: 6
            }
        ) + " Gwei";

    } catch {

        return "-";

    }

}


/* =========================================
   BLOCK TRANSACTIONS
========================================= */

async function loadBlockTransactions() {

    const container =
        document.getElementById(
            "transactions"
        );


    try {

        const response =
            await fetch(

                BLOCKSCOUT_API
                + "/blocks/"
                + blockParam
                + "/transactions"

            );


        if (!response.ok) {

            throw new Error(
                "Transactions unavailable"
            );

        }


        const data =
            await response.json();


        const transactions =
            data.items || [];


        if (
            transactions.length === 0
        ) {

            container.innerHTML = `

                <div class="empty">

                    No transactions found.

                </div>

            `;

            return;

        }


        let html = `

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Transaction
                            </th>

                            <th>
                                From
                            </th>

                            <th>
                                To
                            </th>

                            <th>
                                Value
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>

                    <tbody>

        `;


        transactions.forEach(
            tx => {

                const hash =
                    tx.hash || "";


                const from =
                    tx.from?.hash || "-";


                const to =
                    tx.to?.hash || "-";


                const value =
                    tx.value
                        ? (
                            Number(
                                tx.value
                            ) / 1e18
                          ).toFixed(6)
                          + " ETH"
                        : "0 ETH";


                const status =
                    tx.status === "ok"
                        ? "Success"
                        : "Failed";


                html += `

                    <tr>

                        <td>

                            <a
                                href="tx.html?hash=${hash}">

                                ${shortHash(hash)}

                            </a>

                        </td>


                        <td>

                            <a
                                href="address.html?address=${from}">

                                ${shortHash(from)}

                            </a>

                        </td>


                        <td>

                            <a
                                href="address.html?address=${to}">

                                ${shortHash(to)}

                            </a>

                        </td>


                        <td>

                            ${value}

                        </td>


                        <td>

                            ${status}

                        </td>

                    </tr>

                `;

            }
        );


        html += `

                    </tbody>

                </table>

            </div>

        `;


        container.innerHTML =
            html;


    } catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="empty">

                Unable to load block transactions.

            </div>

        `;

    }

}


/* =========================================
   START
========================================= */

loadBlock();


</script>


</body>

</html>
