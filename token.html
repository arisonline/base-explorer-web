<script>


/* =========================================
   CONFIG
========================================= */

const BLOCKSCOUT_API =
    "https://base.blockscout.com/api/v2";


/* =========================================
   GET TOKEN ADDRESS
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const tokenAddress =
    params.get("address");


/* =========================================
   VALIDATE ADDRESS
========================================= */

function isValidAddress(value) {

    return /^0x[a-fA-F0-9]{40}$/
        .test(value);

}


/* =========================================
   SHORT ADDRESS
========================================= */

function shortAddress(value) {

    if (!value) {
        return "-";
    }

    return (
        value.substring(0, 10)
        + "..."
        + value.substring(
            value.length - 8
        )
    );

}


/* =========================================
   FORMAT TOKEN AMOUNT
========================================= */

function formatTokenAmount(
    value,
    decimals
) {

    try {

        const number =
            Number(value) /
            Math.pow(
                10,
                decimals
            );

        return number.toLocaleString(
            undefined,
            {
                maximumFractionDigits: 6
            }
        );

    } catch {

        return "-";

    }

}


/* =========================================
   LOAD TOKEN
========================================= */

async function loadToken() {

    const container =
        document.getElementById(
            "tokenContainer"
        );


    if (
        !tokenAddress ||
        !isValidAddress(tokenAddress)
    ) {

        container.innerHTML = `

            <div class="error">

                Invalid token address.

            </div>

        `;

        return;

    }


    try {

        const response =
            await fetch(

                BLOCKSCOUT_API
                + "/tokens/"
                + tokenAddress

            );


        if (!response.ok) {

            throw new Error(
                "Token not found"
            );

        }


        const token =
            await response.json();


        displayToken(token);


    } catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="error">

                Unable to load token information.

                <br><br>

                Make sure this address is an
                ERC-20 token contract.

            </div>

        `;

    }

}


/* =========================================
   DISPLAY TOKEN
========================================= */

function displayToken(token) {

    window.currentTokenDecimals =
    Number(
        token.decimals ?? 18
    );

    const container =
        document.getElementById(
            "tokenContainer"
        );


    const name =
        token.name ||
        "Unknown Token";


    const symbol =
        token.symbol ||
        "-";


    const decimals =
        Number(
            token.decimals ?? 18
        );


    const totalSupply =
        token.total_supply
            ? formatTokenAmount(
                token.total_supply,
                decimals
              )
            : "-";


    const type =
        token.type ||
        "ERC-20";


    const iconLetter =
        symbol !== "-"
            ? symbol
                .substring(0, 1)
                .toUpperCase()
            : "T";


    container.innerHTML = `

        <div class="card">

            <div class="card-body">

                <div class="token-header">

                    <div class="token-icon">

                        ${iconLetter}

                    </div>


                    <div>

                        <div class="token-name">

                            ${escapeHTML(name)}

                        </div>


                        <div class="token-symbol">

                            ${escapeHTML(symbol)}

                        </div>

                    </div>

                </div>


                <div class="network-badge">

                    ● Base Mainnet

                </div>

            </div>

        </div>



        <div class="stats">


            <div class="stat">

                <div class="stat-label">

                    Token Symbol

                </div>

                <div class="stat-value">

                    ${escapeHTML(symbol)}

                </div>

            </div>


            <div class="stat">

                <div class="stat-label">

                    Decimals

                </div>

                <div class="stat-value">

                    ${decimals}

                </div>

            </div>


            <div class="stat">

                <div class="stat-label">

                    Total Supply

                </div>

                <div class="stat-value">

                    ${totalSupply}

                </div>

            </div>


        </div>



        <div class="card">

            <div class="card-header">

                Token Information

            </div>


            <div class="details">


                <div class="detail-label">

                    Contract

                </div>

                <div class="detail-value">

                    <a
                        href="address.html?address=${tokenAddress}">

                        ${tokenAddress}

                    </a>

                </div>


                <div class="detail-label">

                    Token Name

                </div>

                <div class="detail-value">

                    ${escapeHTML(name)}

                </div>


                <div class="detail-label">

                    Symbol

                </div>

                <div class="detail-value">

                    ${escapeHTML(symbol)}

                </div>


                <div class="detail-label">

                    Decimals

                </div>

                <div class="detail-value">

                    ${decimals}

                </div>


                <div class="detail-label">

                    Total Supply

                </div>

                <div class="detail-value">

                    ${totalSupply}

                </div>


                <div class="detail-label">

                    Token Type

                </div>

                <div class="detail-value">

                    ${escapeHTML(type)}

                </div>


            </div>

        </div>




        <!-- TOKEN HOLDERS -->

        <div class="card">

            <div class="card-header">

                <span>
                    Token Holders
                </span>

                <span
                    class="holder-count"
                    id="holderCount">
                    Loading...
                </span>

            </div>

            <div
                id="holders">

                <div class="loading">

                    Loading token holders...

                </div>

            </div>

        </div>




        <!-- TOKEN TRANSFERS -->

        <div class="card">
        
            <div class="card-header transfer-header">
        
                <span>
                    Token Transfers
                </span>
        
                <span
                    id="transferCount"
                    class="holder-count">
                    Loading...
                </span>
        
            </div>
        
        
            <div
                id="transfers">
        
                <div class="loading">
        
                    Loading token transfers...
        
                </div>
        
            </div>
        
        
            <!-- PAGINATION -->
        
            <div
                id="transferPagination"
                class="transfer-pagination"
                style="display:none;">
        
                <button
                    id="previousTransfers"
                    onclick="previousTransferPage()">
        
                    ← Previous
        
                </button>
        
        
                <span id="transferPage">
        
                    Page 1
        
                </span>
        
        
                <button
                    id="nextTransfers"
                    onclick="nextTransferPage()">
        
                    Next →
        
                </button>
        
            </div>
        
        </div>



        


        <div class="card">

            <div class="card-header">

                Explorer Links

            </div>


            <div class="card-body">

                <a
                    class="external-link"
                    href="https://basescan.org/token/${tokenAddress}"
                    target="_blank">

                    View on BaseScan →

                </a>

            </div>

        </div>

    `;


    loadHolders(decimals);
    loadTransfers(decimals);

}




    /* =========================================
       TOKEN HOLDERS
    ========================================= */
    
    async function loadHolders(decimals) {
    
        const container =
            document.getElementById(
                "holders"
            );
    
        const countElement =
            document.getElementById(
                "holderCount"
            );
    
        try {
    
            const response =
                await fetch(
    
                    BLOCKSCOUT_API +
                    "/tokens/" +
                    tokenAddress +
                    "/holders"
    
                );
    
            if (!response.ok) {
    
                throw new Error(
                    "Holders unavailable"
                );
    
            }
    
            const data =
                await response.json();
    
            console.log(
                "Token holders:",
                data
            );
    
            const holders =
                data.items || [];
    
            if (
                holders.length === 0
            ) {
    
                countElement.textContent =
                    "0 shown";
    
                container.innerHTML = `
    
                    <div class="empty">
    
                        No token holders found.
    
                    </div>
    
                `;
    
                return;
    
            }
    
            countElement.textContent =
                holders.length +
                " shown";
    
            let html = `
    
                <div class="holders-table">
    
                    <div
                        class="holders-row holders-header">
    
                        <div>
                            #
                        </div>
    
                        <div>
                            Address
                        </div>
    
                        <div>
                            Balance
                        </div>
    
                    </div>
    
            `;
    
    
            holders.forEach(
                (holder, index) => {
    
                    const address =
                        holder.address?.hash ||
                        holder.address ||
                        "";
    
                    const value =
                        holder.value ||
                        "0";
    
                    const balance =
                        formatTokenAmount(
                            value,
                            decimals
                        );
    
    
                    html += `
    
                        <div class="holders-row">
    
                            <div
                                class="holder-rank">
    
                                ${index + 1}
    
                            </div>
    
    
                            <div
                                class="holder-address"
                                onclick="openHolderAddress('${address}')">
    
                                ${shortAddress(address)}
    
                            </div>
    
    
                            <div
                                class="holder-balance">
    
                                ${balance}
    
                            </div>
    
                        </div>
    
                    `;
    
                }
            );
    
    
            html += `
    
                </div>
    
            `;
    
    
            container.innerHTML =
                html;
    
    
        } catch (error) {
    
            console.error(
                "Token holders error:",
                error
            );
    
            countElement.textContent =
                "Unavailable";
    
            container.innerHTML = `
    
                <div class="empty">
    
                    Unable to load token holders.
    
                </div>
    
            `;
    
        }
    
    }





    /* =========================================
       OPEN HOLDER ADDRESS
    ========================================= */
    
    function openHolderAddress(address) {
    
        if (!address) {
    
            return;
    
        }
    
        window.location.href =
            "address.html?address=" +
            encodeURIComponent(address);
    
    }
    


    /* =========================================
       TOKEN TRANSFERS
    ========================================= */
    
    let transferPage = 1;
    
    let transferNextPageKey = null;
    
    let transferPreviousKeys = [];
    
    
    /* =========================================
       LOAD TOKEN TRANSFERS
    ========================================= */
    
    async function loadTransfers(decimals) {


        if (
    transferPage === 1
) {

    transferNextPageKey = null;

}

        
    
        const container =
            document.getElementById(
                "transfers"
            );
    
        const countElement =
            document.getElementById(
                "transferCount"
            );
    
        try {
    
            let url =
                BLOCKSCOUT_API +
                "/tokens/" +
                tokenAddress +
                "/transfers";
    
    
            /*
             * If we are loading the next page,
             * add the pagination key.
             */
    
            if (
                transferNextPageKey
            ) {
    
                url +=
                    "?next_page_params=" +
                    encodeURIComponent(
                        JSON.stringify(
                            transferNextPageKey
                        )
                    );
    
            }
    
    
            const response =
                await fetch(url);
    
    
            if (!response.ok) {
    
                throw new Error(
                    "Transfers unavailable"
                );
    
            }
    
    
            const data =
                await response.json();
    
    
            console.log(
                "Token transfers:",
                data
            );
    
    
            const transfers =
                data.items || [];
    
    
            /*
             * Save next page information
             */
    
            if (
                data.next_page_params
            ) {
    
                transferNextPageKey =
                    data.next_page_params;
    
            } else {
    
                transferNextPageKey =
                    null;
    
            }
    
    
            /*
             * Update count
             */
    
            countElement.textContent =
                transfers.length +
                " shown";
    
    
            /*
             * No transfers
             */
    
            if (
                transfers.length === 0
            ) {
    
                container.innerHTML = `
    
                    <div class="empty">
    
                        No token transfers found.
    
                    </div>
    
                `;
    
                updateTransferPagination();
    
                return;
    
            }
    
    
            /*
             * Create table
             */
    
            let html = `
    
                <div class="table-wrapper">
    
                    <table>
    
                        <thead>
    
                            <tr>
    
                                <th>
                                    Transaction
                                </th>
    
                                <th>
                                    From
                                </th>
    
                                <th>
                                    To
                                </th>
    
                                <th>
                                    Amount
                                </th>
    
                                <th>
                                    Block
                                </th>
    
                                <th>
                                    Time
                                </th>
    
                            </tr>
    
                        </thead>
    
                        <tbody>
    
            `;
    
    
            transfers.forEach(
                transfer => {
    
                    /*
                     * Transaction hash
                     */
    
                    const hash =
                        transfer.tx_hash ||
                        transfer.transaction_hash ||
                        transfer.transaction?.hash ||
                        "";
    
    
                    /*
                     * From
                     */
    
                    const from =
                        transfer.from?.hash ||
                        transfer.from ||
                        "";
    
    
                    /*
                     * To
                     */
    
                    const to =
                        transfer.to?.hash ||
                        transfer.to ||
                        "";
    
    
                    /*
                     * Amount
                     */
    
                    const amount =
                        transfer.total?.value ||
                        transfer.value ||
                        "0";
    
    
                    /*
                     * Block
                     */
    
                    const block =
                        transfer.block_number ||
                        transfer.blockNumber ||
                        "-";
    
    
                    /*
                     * Timestamp
                     */
    
                    const timestamp =
                        transfer.timestamp ||
                        transfer.block_timestamp ||
                        "";
    
    
                    const formattedTime =
                        formatTransferTime(
                            timestamp
                        );
    
    
                    html += `
    
                        <tr>
    
                            <td>
    
                                <a
                                    href="tx.html?hash=${encodeURIComponent(hash)}">
    
                                    ${shortAddress(hash)}
    
                                </a>
    
                            </td>
    
    
                            <td>
    
                                <a
                                    href="address.html?address=${encodeURIComponent(from)}">
    
                                    ${shortAddress(from)}
    
                                </a>
    
                            </td>
    
    
                            <td>
    
                                <a
                                    href="address.html?address=${encodeURIComponent(to)}">
    
                                    ${shortAddress(to)}
    
                                </a>
    
                            </td>
    
    
                            <td
                                class="transfer-amount">
    
                                ${formatTokenAmount(
                                    amount,
                                    decimals
                                )}
    
                            </td>
    
    
                            <td>
    
                                ${block}
    
                            </td>
    
    
                            <td
                                class="transfer-time">
    
                                ${formattedTime}
    
                            </td>
    
                        </tr>
    
                    `;
    
                }
            );
    
    
            html += `
    
                        </tbody>
    
                    </table>
    
                </div>
    
            `;
    
    
            container.innerHTML =
                html;
    
    
            updateTransferPagination();
    
    
        }
    
        catch (error) {
    
            console.error(
                "Token transfers error:",
                error
            );
    
    
            countElement.textContent =
                "Unavailable";
    
    
            container.innerHTML = `
    
                <div class="empty">
    
                    Unable to load token transfers.
    
                    <br><br>
    
                    Please refresh the page.
    
                </div>
    
            `;
    
        }
    
    }





    /* =========================================
       FORMAT TRANSFER TIME
    ========================================= */
    
    function formatTransferTime(
        timestamp
    ) {
    
        if (!timestamp) {
    
            return "-";
    
        }
    
    
        try {
    
            const date =
                new Date(timestamp);
    
    
            if (
                isNaN(
                    date.getTime()
                )
            ) {
    
                return "-";
    
            }
    
    
            return date.toLocaleString();
    
        }
    
        catch {
    
            return "-";
    
        }
    
    }




    /* =========================================
       UPDATE PAGINATION
    ========================================= */
    
    function updateTransferPagination() {
    
        const pagination =
            document.getElementById(
                "transferPagination"
            );
    
        const previousButton =
            document.getElementById(
                "previousTransfers"
            );
    
        const nextButton =
            document.getElementById(
                "nextTransfers"
            );
    
        const pageElement =
            document.getElementById(
                "transferPage"
            );
    
    
        if (!pagination) {
    
            return;
    
        }
    
    
        pagination.style.display =
            "flex";
    
    
        pageElement.textContent =
            "Page " +
            transferPage;
    
    
        /*
         * Previous is disabled on page 1
         */
    
        previousButton.disabled =
            transferPage <= 1;
    
    
        /*
         * Next is disabled when
         * there is no next page
         */
    
        nextButton.disabled =
            !transferNextPageKey;
    
    }





    /* =========================================
       NEXT TRANSFER PAGE
    ========================================= */
    
    async function nextTransferPage() {
    
        if (
            !transferNextPageKey
        ) {
    
            return;
    
        }
    
    
        transferPreviousKeys.push(
            transferNextPageKey
        );
    
    
        transferPage++;
    
    
        /*
         * Load next page
         */
    
        await loadTransfers(
            getCurrentTokenDecimals()
        );
    
    }




    /* =========================================
       PREVIOUS TRANSFER PAGE
    ========================================= */
    
    async function previousTransferPage() {
    
        if (
            transferPage <= 1
        ) {
    
            return;
    
        }
    
    
        /*
         * Return to first page for now.
         */
    
        transferPage = 1;
    
        transferNextPageKey = null;
    
        transferPreviousKeys = [];
    
    
        await loadTransfers(
            getCurrentTokenDecimals()
        );
    
    }




    /* =========================================
       GET TOKEN DECIMALS
    ========================================= */
    
    function getCurrentTokenDecimals() {
    
        const decimalsElement =
            document.querySelector(
                ".stat-value"
            );
    
        /*
         * Your token object already gives us
         * decimals, so store it globally.
         */
    
        return window.currentTokenDecimals ?? 18;
    
    }


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================
   START
========================================= */

loadToken();


</script>
