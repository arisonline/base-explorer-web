<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Token | Base Explorer</title>

    <meta
        name="description"
        content="View Base Mainnet token information, holders, transfers, supply and contract details."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <link rel="stylesheet" href="global.css">

    <style>

        /* =================================================
           PAGE CONTAINER
        ================================================= */

        .container {
            width: min(1240px, 94%);

            margin: 0 auto 60px;
        }


        /* =================================================
           BREADCRUMB
        ================================================= */

        .breadcrumb {
            padding: 25px 0 16px;

            color: #6b7280;

            font-size: 13px;
        }

        .breadcrumb a {
            color: #0052ff;

            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }


        /* =================================================
           CARD
        ================================================= */

        .card {
            background: #ffffff;

            border: 1px solid #e5e7eb;

            border-radius: 10px;

            margin-bottom: 18px;

            overflow: hidden;
        }

        .card-header {
            min-height: 56px;

            padding: 0 18px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            border-bottom: 1px solid #eef0f3;

            font-size: 15px;

            font-weight: 700;
        }

        .card-body {
            padding: 20px;
        }


        /* =================================================
           TOKEN HEADER
        ================================================= */

        .token-header {
            display: flex;

            align-items: center;

            gap: 14px;
        }

        .token-icon {
            width: 52px;
            height: 52px;

            flex-shrink: 0;

            border-radius: 50%;

            background: #eef4ff;

            color: #0052ff;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 18px;

            font-weight: 800;
        }

        .token-name {
            color: #111827;

            font-size: 24px;

            line-height: 1.2;

            font-weight: 700;

            letter-spacing: -0.3px;
        }

        .token-symbol {
            margin-top: 4px;

            color: #6b7280;

            font-size: 13px;
        }


        /* =================================================
           NETWORK BADGE
        ================================================= */

        .network-badge {
            display: inline-flex;

            align-items: center;

            gap: 6px;

            margin-top: 15px;

            padding: 5px 9px;

            background: #ecfdf5;

            color: #15803d;

            border-radius: 999px;

            font-size: 11px;

            font-weight: 600;
        }


        /* =================================================
           STATS
        ================================================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 16px;

            margin-bottom: 18px;
        }

        .stat {
            background: #ffffff;

            border: 1px solid #e5e7eb;

            border-radius: 10px;

            padding: 18px;
        }

        .stat-label {
            margin-bottom: 7px;

            color: #6b7280;

            font-size: 12px;
        }

        .stat-value {
            color: #111827;

            font-size: 19px;

            font-weight: 700;

            word-break: break-word;
        }


        /* =================================================
           DETAILS
        ================================================= */

        .details {
            display: grid;

            grid-template-columns:
                200px 1fr;
        }

        .detail-label {
            padding: 14px 18px;

            background: #fafafa;

            border-bottom: 1px solid #f0f1f3;

            color: #6b7280;

            font-size: 12px;

            font-weight: 500;
        }

        .detail-value {
            min-width: 0;

            padding: 14px 18px;

            border-bottom: 1px solid #f0f1f3;

            color: #111827;

            font-size: 12px;

            word-break: break-word;
        }

        .detail-value a {
            color: #0052ff;

            text-decoration: none;

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;
        }

        .detail-value a:hover {
            text-decoration: underline;
        }


        /* =================================================
           TABLE
        ================================================= */

        .table-wrapper {
            width: 100%;

            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px 18px;

            text-align: left;

            border-bottom: 1px solid #f0f1f3;

            font-size: 12px;

            white-space: nowrap;
        }

        th {
            background: #fafafa;

            color: #6b7280;

            font-size: 11px;

            font-weight: 600;
        }

        tbody tr:hover {
            background: #f8faff;
        }

        td a {
            color: #0052ff;

            text-decoration: none;

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;
        }

        td a:hover {
            text-decoration: underline;
        }


        /* =================================================
           HOLDERS
        ================================================= */

        .holders-table {
            width: 100%;

            overflow-x: auto;
        }

        .holders-row {
            display: grid;

            grid-template-columns:
                55px 1fr 220px;

            gap: 15px;

            align-items: center;

            padding: 14px 18px;

            border-bottom: 1px solid #f0f1f3;

            font-size: 12px;
        }

        .holders-row:last-child {
            border-bottom: 0;
        }

        .holders-header {
            background: #fafafa;

            color: #6b7280;

            font-size: 11px;

            font-weight: 600;
        }

        .holder-address {
            color: #0052ff;

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;

            cursor: pointer;
        }

        .holder-address:hover {
            text-decoration: underline;
        }

        .holder-balance {
            text-align: right;

            color: #374151;

            font-weight: 600;
        }

        .holder-rank {
            color: #9ca3af;
        }

        .holder-count {
            color: #9ca3af;

            font-size: 11px;

            font-weight: 500;
        }


        /* =================================================
           TRANSFERS
        ================================================= */

        .transfer-amount {
            color: #374151;

            font-weight: 600;
        }

        .transfer-time {
            color: #6b7280;

            font-size: 11px;
        }


        /* =================================================
           PAGINATION
        ================================================= */

        .transfer-pagination {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 15px;

            padding: 16px;

            border-top: 1px solid #f0f1f3;
        }

        .transfer-pagination button {
            border: 1px solid #dbe1ea;

            background: #ffffff;

            color: #0052ff;

            padding: 7px 12px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 12px;

            font-weight: 600;
        }

        .transfer-pagination button:hover {
            background: #f5f8ff;
        }

        .transfer-pagination button:disabled {
            color: #9ca3af;

            background: #f3f4f6;

            cursor: not-allowed;
        }

        #transferPage {
            color: #6b7280;

            font-size: 12px;

            font-weight: 600;
        }


        /* =================================================
           LOADING / EMPTY / ERROR
        ================================================= */

        .loading {
            padding: 45px 20px;

            text-align: center;

            color: #9ca3af;

            font-size: 13px;
        }

        .empty {
            padding: 40px 20px;

            text-align: center;

            color: #9ca3af;

            font-size: 13px;
        }

        .error {
            padding: 18px;

            background: #fef2f2;

            color: #dc2626;

            border-radius: 8px;

            text-align: center;

            font-size: 13px;
        }


        /* =================================================
           EXTERNAL LINK
        ================================================= */

        .external-link {
            display: inline-flex;

            align-items: center;

            padding: 9px 13px;

            background: #0052ff;

            color: #ffffff;

            text-decoration: none;

            border-radius: 7px;

            font-size: 12px;

            font-weight: 600;
        }

        .external-link:hover {
            background: #0047df;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 700px) {

            .container {
                width: 94%;
            }

            .breadcrumb {
                padding-top: 18px;
            }

            .card-body {
                padding: 16px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .token-name {
                font-size: 21px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .detail-label {
                padding: 11px 14px 4px;

                border-bottom: none;

                background: #ffffff;
            }

            .detail-value {
                padding: 4px 14px 11px;
            }

            .holders-row {
                grid-template-columns:
                    40px 1fr 125px;

                gap: 8px;

                padding: 13px 12px;

                font-size: 11px;
            }

            th,
            td {
                padding: 12px 14px;

                font-size: 11px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     UNIVERSAL HEADER
===================================================== -->

<div id="siteHeader"></div>


<main class="container">


    <!-- =================================================
         BREADCRUMB
    ================================================= -->

    <div class="breadcrumb">

        <a href="index.html">
            Home
        </a>

        /

        Token

    </div>


    <!-- =================================================
         TOKEN CONTAINER
    ================================================= -->

    <div id="tokenContainer">

        <div class="loading">
            Loading token...
        </div>

    </div>


</main>


<!-- =====================================================
     UNIVERSAL FOOTER
===================================================== -->

<div id="siteFooter"></div>


<script src="site.js"></script>


<script>

    /* =========================================================
       CONFIG
    ========================================================= */

    const BLOCKSCOUT_API =
        "https://base.blockscout.com/api/v2";


    /* =========================================================
       GET TOKEN ADDRESS
    ========================================================= */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const tokenAddress =
        params.get("address");


    /* =========================================================
       PAGINATION STATE
    ========================================================= */

    let transferPage = 1;

    /*
     * Page requests.
     *
     * Page 1 = null
     *
     * Page 2 = next_page_params from page 1
     *
     * Page 3 = next_page_params from page 2
     */

    const transferPageRequests = [
        null
    ];

    let transferNextPageParams = null;


    let currentTokenDecimals = 18;


    /* =========================================================
       VALIDATE ADDRESS
    ========================================================= */

    function isValidAddress(value) {

        return /^0x[a-fA-F0-9]{40}$/.test(
            value || ""
        );

    }


    /* =========================================================
       SHORT ADDRESS / HASH
    ========================================================= */

    function shortAddress(value) {

        if (!value) {
            return "-";
        }

        return (
            value.substring(0, 10) +
            "..." +
            value.substring(
                value.length - 8
            )
        );

    }


    /* =========================================================
       FORMAT TOKEN AMOUNT
    ========================================================= */

    function formatTokenAmount(
        value,
        decimals
    ) {

        try {

            const raw =
                BigInt(value || "0");

            const divisor =
                10n ** BigInt(decimals);

            const whole =
                raw / divisor;

            const remainder =
                raw % divisor;


            if (
                remainder === 0n
            ) {

                return whole.toLocaleString();

            }


            const fraction =
                remainder
                    .toString()
                    .padStart(
                        decimals,
                        "0"
                    )
                    .replace(
                        /0+$/,
                        ""
                    )
                    .substring(
                        0,
                        6
                    );


            return (
                whole.toLocaleString() +
                "." +
                fraction
            );

        } catch {

            return "-";

        }

    }


    /* =========================================================
       HTML ESCAPE
    ========================================================= */

    function escapeHTML(value) {

        return String(value ?? "")
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =========================================================
       LOAD TOKEN
    ========================================================= */

    async function loadToken() {

        const container =
            document.getElementById(
                "tokenContainer"
            );


        if (
            !tokenAddress ||
            !isValidAddress(tokenAddress)
        ) {

            container.innerHTML = `

                <div class="error">

                    Invalid token address.

                </div>

            `;

            return;

        }


        try {

            const response =
                await fetch(
                    BLOCKSCOUT_API +
                    "/tokens/" +
                    encodeURIComponent(
                        tokenAddress
                    )
                );


            if (!response.ok) {

                throw new Error(
                    "Token not found"
                );

            }


            const token =
                await response.json();


            displayToken(token);


        } catch (error) {

            console.error(
                "Token loading error:",
                error
            );


            container.innerHTML = `

                <div class="error">

                    Unable to load token information.

                    <br><br>

                    Make sure this address is
                    an ERC-20 token contract.

                </div>

            `;

        }

    }


    /* =========================================================
       DISPLAY TOKEN
    ========================================================= */

    function displayToken(token) {

        currentTokenDecimals =
            Number(
                token.decimals ?? 18
            );


        const container =
            document.getElementById(
                "tokenContainer"
            );


        const name =
            token.name ||
            "Unknown Token";


        const symbol =
            token.symbol ||
            "-";


        const decimals =
            currentTokenDecimals;


        const totalSupply =
            token.total_supply
                ? formatTokenAmount(
                    token.total_supply,
                    decimals
                )
                : "-";


        const type =
            token.type ||
            "ERC-20";


        const iconLetter =
            symbol !== "-"
                ? symbol
                    .substring(0, 1)
                    .toUpperCase()
                : "T";


        container.innerHTML = `

            <!-- TOKEN HEADER -->

            <div class="card">

                <div class="card-body">

                    <div class="token-header">

                        <div class="token-icon">

                            ${escapeHTML(
                                iconLetter
                            )}

                        </div>


                        <div>

                            <div class="token-name">

                                ${escapeHTML(
                                    name
                                )}

                            </div>


                            <div class="token-symbol">

                                ${escapeHTML(
                                    symbol
                                )}

                            </div>

                        </div>

                    </div>


                    <div class="network-badge">

                        ● Base Mainnet

                    </div>

                </div>

            </div>


            <!-- TOKEN STATS -->

            <div class="stats">


                <div class="stat">

                    <div class="stat-label">
                        Token Symbol
                    </div>

                    <div class="stat-value">

                        ${escapeHTML(
                            symbol
                        )}

                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        Decimals
                    </div>

                    <div class="stat-value">

                        ${decimals}

                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        Total Supply
                    </div>

                    <div class="stat-value">

                        ${escapeHTML(
                            totalSupply
                        )}

                    </div>

                </div>


            </div>


            <!-- TOKEN INFORMATION -->

            <div class="card">

                <div class="card-header">

                    Token Information

                </div>


                <div class="details">


                    <div class="detail-label">
                        Contract
                    </div>

                    <div class="detail-value">

                        <a
                            href="address.html?address=${encodeURIComponent(tokenAddress)}"
                        >

                            ${tokenAddress}

                        </a>

                    </div>


                    <div class="detail-label">
                        Token Name
                    </div>

                    <div class="detail-value">

                        ${escapeHTML(name)}

                    </div>


                    <div class="detail-label">
                        Symbol
                    </div>

                    <div class="detail-value">

                        ${escapeHTML(symbol)}

                    </div>


                    <div class="detail-label">
                        Decimals
                    </div>

                    <div class="detail-value">

                        ${decimals}

                    </div>


                    <div class="detail-label">
                        Total Supply
                    </div>

                    <div class="detail-value">

                        ${escapeHTML(
                            totalSupply
                        )}

                    </div>


                    <div class="detail-label">
                        Token Type
                    </div>

                    <div class="detail-value">

                        ${escapeHTML(type)}

                    </div>


                </div>

            </div>


            <!-- TOKEN HOLDERS -->

            <div class="card">

                <div class="card-header">

                    <span>
                        Token Holders
                    </span>

                    <span
                        class="holder-count"
                        id="holderCount"
                    >
                        Loading...
                    </span>

                </div>


                <div id="holders">

                    <div class="loading">

                        Loading token holders...

                    </div>

                </div>

            </div>


            <!-- TOKEN TRANSFERS -->

            <div class="card">

                <div class="card-header">

                    <span>
                        Token Transfers
                    </span>

                    <span
                        id="transferCount"
                        class="holder-count"
                    >
                        Loading...
                    </span>

                </div>


                <div id="transfers">

                    <div class="loading">

                        Loading token transfers...

                    </div>

                </div>


                <div
                    id="transferPagination"
                    class="transfer-pagination"
                    style="display:none;"
                >

                    <button
                        id="previousTransfers"
                        type="button"
                        onclick="previousTransferPage()"
                    >
                        ← Previous
                    </button>


                    <span id="transferPage">
                        Page 1
                    </span>


                    <button
                        id="nextTransfers"
                        type="button"
                        onclick="nextTransferPage()"
                    >
                        Next →
                    </button>

                </div>

            </div>


            <!-- EXPLORER LINKS -->

            <div class="card">

                <div class="card-header">

                    Explorer Links

                </div>


                <div class="card-body">

                    <a
                        class="external-link"
                        href="https://basescan.org/token/${encodeURIComponent(tokenAddress)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        View on BaseScan →

                    </a>

                </div>

            </div>

        `;


        loadHolders(decimals);

        loadTransfers(decimals);

    }


    /* =========================================================
       TOKEN HOLDERS
    ========================================================= */

    async function loadHolders(decimals) {

        const container =
            document.getElementById(
                "holders"
            );


        const countElement =
            document.getElementById(
                "holderCount"
            );


        try {

            const response =
                await fetch(
                    BLOCKSCOUT_API +
                    "/tokens/" +
                    encodeURIComponent(
                        tokenAddress
                    ) +
                    "/holders"
                );


            if (!response.ok) {

                throw new Error(
                    "Holders unavailable"
                );

            }


            const data =
                await response.json();


            const holders =
                data.items || [];


            if (
                holders.length === 0
            ) {

                countElement.textContent =
                    "0 shown";


                container.innerHTML = `

                    <div class="empty">

                        No token holders found.

                    </div>

                `;

                return;

            }


            countElement.textContent =
                holders.length +
                " shown";


            let html = `

                <div class="holders-table">

                    <div
                        class="holders-row holders-header"
                    >

                        <div>
                            #
                        </div>

                        <div>
                            Address
                        </div>

                        <div>
                            Balance
                        </div>

                    </div>

            `;


            holders.forEach(
                (holder, index) => {

                    const address =
                        holder.address?.hash ||
                        holder.address ||
                        "";


                    const value =
                        holder.value ||
                        "0";


                    const balance =
                        formatTokenAmount(
                            value,
                            decimals
                        );


                    html += `

                        <div class="holders-row">

                            <div class="holder-rank">

                                ${index + 1}

                            </div>


                            <div
                                class="holder-address"
                                onclick="openHolderAddress('${escapeJS(address)}')"
                                title="${escapeHTML(address)}"
                            >

                                ${shortAddress(
                                    address
                                )}

                            </div>


                            <div class="holder-balance">

                                ${escapeHTML(
                                    balance
                                )}

                            </div>

                        </div>

                    `;

                }
            );


            html += `

                </div>

            `;


            container.innerHTML =
                html;


        } catch (error) {

            console.error(
                "Token holders error:",
                error
            );


            countElement.textContent =
                "Unavailable";


            container.innerHTML = `

                <div class="empty">

                    Unable to load token holders.

                </div>

            `;

        }

    }


    /* =========================================================
       OPEN HOLDER ADDRESS
    ========================================================= */

    function openHolderAddress(address) {

        if (!address) {
            return;
        }


        window.location.href =
            "address.html?address=" +
            encodeURIComponent(
                address
            );

    }


    /* =========================================================
       ESCAPE JS STRING
    ========================================================= */

    function escapeJS(value) {

        return String(value ?? "")
            .replace(
                /\\/g,
                "\\\\"
            )
            .replace(
                /'/g,
                "\\'"
            );

    }


    /* =========================================================
       LOAD TOKEN TRANSFERS
    ========================================================= */

    async function loadTransfers(decimals) {

        const container =
            document.getElementById(
                "transfers"
            );


        const countElement =
            document.getElementById(
                "transferCount"
            );


        try {

            let url =
                BLOCKSCOUT_API +
                "/tokens/" +
                encodeURIComponent(
                    tokenAddress
                ) +
                "/transfers";


            /*
             * Blockscout returns an object such as:
             *
             * {
             *     block_number: ...,
             *     index: ...,
             *     items_count: ...
             * }
             *
             * for next_page_params.
             *
             * Those values need to be sent as
             * individual query parameters.
             */

            if (
                transferPageRequests[
                    transferPage - 1
                ]
            ) {

                const params =
                    new URLSearchParams(
                        Object.entries(
                            transferPageRequests[
                                transferPage - 1
                            ]
                        ).filter(
                            ([, value]) =>
                                value !== null &&
                                value !== undefined
                        )
                    );


                url += "?" + params.toString();

            }


            container.innerHTML = `

                <div class="loading">

                    Loading token transfers...

                </div>

            `;


            const response =
                await fetch(url);


            if (!response.ok) {

                throw new Error(
                    "Transfers unavailable"
                );

            }


            const data =
                await response.json();


            const transfers =
                data.items || [];


            transferNextPageParams =
                data.next_page_params ||
                null;


            /*
             * Save the next page request.
             */

            if (
                transferNextPageParams &&
                !transferPageRequests[
                    transferPage
                ]
            ) {

                transferPageRequests[
                    transferPage
                ] =
                    transferNextPageParams;

            }


            countElement.textContent =
                transfers.length +
                " shown";


            if (
                transfers.length === 0
            ) {

                container.innerHTML = `

                    <div class="empty">

                        No token transfers found.

                    </div>

                `;


                updateTransferPagination();

                return;

            }


            let html = `

                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    Transaction
                                </th>

                                <th>
                                    From
                                </th>

                                <th>
                                    To
                                </th>

                                <th>
                                    Amount
                                </th>

                                <th>
                                    Block
                                </th>

                                <th>
                                    Time
                                </th>

                            </tr>

                        </thead>

                        <tbody>

            `;


            transfers.forEach(
                transfer => {

                    const hash =
                        transfer.tx_hash ||
                        transfer.transaction_hash ||
                        transfer.transaction?.hash ||
                        "";


                    const from =
                        transfer.from?.hash ||
                        transfer.from ||
                        "";


                    const to =
                        transfer.to?.hash ||
                        transfer.to ||
                        "";


                    const amount =
                        transfer.total?.value ||
                        transfer.value ||
                        "0";


                    const block =
                        transfer.block_number ||
                        transfer.blockNumber ||
                        "-";


                    const timestamp =
                        transfer.timestamp ||
                        transfer.block_timestamp ||
                        "";


                    const formattedTime =
                        formatTransferTime(
                            timestamp
                        );


                    html += `

                        <tr>

                            <td>

                                ${
                                    hash
                                        ? `
                                            <a
                                                href="tx.html?hash=${encodeURIComponent(hash)}"
                                                title="${escapeHTML(hash)}"
                                            >
                                                ${shortAddress(hash)}
                                            </a>
                                        `
                                        : "-"
                                }

                            </td>


                            <td>

                                ${
                                    from
                                        ? `
                                            <a
                                                href="address.html?address=${encodeURIComponent(from)}"
                                                title="${escapeHTML(from)}"
                                            >
                                                ${shortAddress(from)}
                                            </a>
                                        `
                                        : "-"
                                }

                            </td>


                            <td>

                                ${
                                    to
                                        ? `
                                            <a
                                                href="address.html?address=${encodeURIComponent(to)}"
                                                title="${escapeHTML(to)}"
                                            >
                                                ${shortAddress(to)}
                                            </a>
                                        `
                                        : "-"
                                }

                            </td>


                            <td class="transfer-amount">

                                ${escapeHTML(
                                    formatTokenAmount(
                                        amount,
                                        decimals
                                    )
                                )}

                            </td>


                            <td>

                                ${escapeHTML(
                                    String(block)
                                )}

                            </td>


                            <td class="transfer-time">

                                ${escapeHTML(
                                    formattedTime
                                )}

                            </td>

                        </tr>

                    `;

                }
            );


            html += `

                        </tbody>

                    </table>

                </div>

            `;


            container.innerHTML =
                html;


            updateTransferPagination();


        } catch (error) {

            console.error(
                "Token transfers error:",
                error
            );


            countElement.textContent =
                "Unavailable";


            container.innerHTML = `

                <div class="empty">

                    Unable to load token transfers.

                    <br><br>

                    Please try again later.

                </div>

            `;

        }

    }


    /* =========================================================
       FORMAT TRANSFER TIME
    ========================================================= */

    function formatTransferTime(
        timestamp
    ) {

        if (!timestamp) {
            return "-";
        }


        try {

            const date =
                new Date(timestamp);


            if (
                isNaN(
                    date.getTime()
                )
            ) {

                return "-";

            }


            return date.toLocaleString();

        } catch {

            return "-";

        }

    }


    /* =========================================================
       UPDATE PAGINATION
    ========================================================= */

    function updateTransferPagination() {

        const pagination =
            document.getElementById(
                "transferPagination"
            );


        const previousButton =
            document.getElementById(
                "previousTransfers"
            );


        const nextButton =
            document.getElementById(
                "nextTransfers"
            );


        const pageElement =
            document.getElementById(
                "transferPage"
            );


        if (
            !pagination ||
            !previousButton ||
            !nextButton ||
            !pageElement
        ) {

            return;

        }


        /*
         * Only show pagination when there
         * is a next page or we are beyond
         * page 1.
         */

        if (
            transferPage > 1 ||
            transferNextPageParams
        ) {

            pagination.style.display =
                "flex";

        } else {

            pagination.style.display =
                "none";

        }


        pageElement.textContent =
            "Page " +
            transferPage;


        previousButton.disabled =
            transferPage <= 1;


        nextButton.disabled =
            !transferNextPageParams;

    }


    /* =========================================================
       NEXT TRANSFER PAGE
    ========================================================= */

    async function nextTransferPage() {

        if (
            !transferNextPageParams
        ) {

            return;

        }


        /*
         * The current page's next params
         * become the request for the next page.
         */

        transferPageRequests[
            transferPage
        ] =
            transferNextPageParams;


        transferPage++;


        await loadTransfers(
            currentTokenDecimals
        );

    }


    /* =========================================================
       PREVIOUS TRANSFER PAGE
    ========================================================= */

    async function previousTransferPage() {

        if (
            transferPage <= 1
        ) {

            return;

        }


        transferPage--;


        await loadTransfers(
            currentTokenDecimals
        );

    }


    /* =========================================================
       START
    ========================================================= */

    loadToken();

</script>


</body>

</html>
