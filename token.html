<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Token | Base Explorer</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f6f8fb;
            color: #1f2937;
        }

        header {
            height: 64px;
            background: white;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
        }

        .header-inner {
            width: min(1200px, 94%);
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            text-decoration: none;
            color: #111827;

            font-size: 19px;
            font-weight: 700;
        }

        .logo-icon {
            width: 34px;
            height: 34px;

            border-radius: 9px;

            background: #0052ff;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 22px;
        }

        nav a {
            text-decoration: none;
            color: #4b5563;
            font-size: 14px;
        }

        nav a:hover {
            color: #0052ff;
        }

        .container {
            width: min(1200px, 94%);
            margin: 30px auto 60px;
        }

        .breadcrumb {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 15px;
        }

        .breadcrumb a {
            color: #0052ff;
            text-decoration: none;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .card-header {
            padding: 18px 20px;
            border-bottom: 1px solid #e5e7eb;

            font-size: 17px;
            font-weight: 700;
        }

        .card-body {
            padding: 20px;
        }

        .token-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .token-icon {
            width: 55px;
            height: 55px;

            border-radius: 50%;

            background: #0052ff;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
            font-weight: bold;
        }

        .token-name {
            font-size: 25px;
            font-weight: 700;
        }

        .token-symbol {
            margin-top: 5px;

            color: #6b7280;

            font-size: 14px;
        }

        .network-badge {
            display: inline-block;

            margin-top: 15px;

            background: #ecfdf5;
            color: #15803d;

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 12px;
            font-weight: 600;
        }

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;

            margin-bottom: 20px;
        }

        .stat {
            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 12px;

            padding: 20px;
        }

        .stat-label {
            color: #6b7280;

            font-size: 13px;

            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;

            word-break: break-word;
        }

        .details {
            display: grid;

            grid-template-columns:
                220px 1fr;
        }

        .detail-label {
            padding: 16px 20px;

            background: #fafafa;

            border-bottom: 1px solid #f0f1f3;

            color: #6b7280;

            font-size: 13px;
        }

        .detail-value {
            padding: 16px 20px;

            border-bottom: 1px solid #f0f1f3;

            font-size: 13px;

            word-break: break-all;
        }

        .detail-value a {
            color: #0052ff;

            text-decoration: none;

            font-family: monospace;
        }

        .hash {
            font-family: monospace;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px 20px;

            text-align: left;

            border-bottom:
                1px solid #f0f1f3;

            font-size: 13px;

            white-space: nowrap;
        }

        th {
            background: #fafafa;

            color: #6b7280;

            font-weight: 600;
        }

        td a {
            color: #0052ff;

            text-decoration: none;

            font-family: monospace;
        }

        .success {
            color: #16a34a;

            font-weight: 600;
        }

        .loading {
            padding: 50px;

            text-align: center;

            color: #9ca3af;
        }

        .empty {
            padding: 40px;

            text-align: center;

            color: #9ca3af;
        }

        .error {
            padding: 20px;

            background: #fef2f2;

            color: #dc2626;

            border-radius: 10px;

            text-align: center;
        }

        .external-link {
            display: inline-block;

            padding: 10px 14px;

            background: #0052ff;

            color: white;

            text-decoration: none;

            border-radius: 7px;

            font-size: 13px;
        }


        /* =========================================
           TOKEN HOLDERS
        ========================================= */
        
        .holders-table {
            width: 100%;
            overflow-x: auto;
        }
        
        .holders-row {
        
            display: grid;
        
            grid-template-columns:
                60px
                1fr
                220px;
        
            gap: 15px;
        
            align-items: center;
        
            padding: 15px 20px;
        
            border-bottom:
                1px solid #f0f1f3;
        
            font-size: 13px;
        
        }
        
        .holders-row:last-child {
            border-bottom: 0;
        }
        
        .holders-header {
        
            background: #fafafa;
        
            color: #6b7280;
        
            font-weight: 600;
        
        }
        
        .holder-address {
        
            color: #0052ff;
        
            font-family: monospace;
        
            cursor: pointer;
        
        }
        
        .holder-balance {
        
            text-align: right;
        
            font-weight: 600;
        
        }
        
        .holder-rank {
        
            color: #6b7280;
        
        }
        
        .holder-count {
        
            font-size: 12px;
        
            color: #6b7280;
        
            font-weight: 400;
        
        }
        
        @media (max-width: 768px) {
        
            .holders-row {
        
                grid-template-columns:
                    40px
                    1fr
                    130px;
        
                gap: 8px;
        
                padding: 14px 12px;
        
                font-size: 12px;
        
            }
        
        }
        

        footer {
            background: white;

            border-top:
                1px solid #e5e7eb;

            padding: 25px;

            text-align: center;

            color: #6b7280;

            font-size: 13px;
        }

        @media (max-width: 768px) {

            nav {
                display: none;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .detail-label {
                padding-bottom: 5px;

                border-bottom: none;
            }

            .detail-value {
                padding-top: 5px;
            }

            .token-name {
                font-size: 20px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-inner">

        <a
            href="index.html"
            class="logo">

            <div class="logo-icon">
                B
            </div>

            Base Explorer

        </a>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="#">
                Blockchain
            </a>

            <a href="token.html">
                Tokens
            </a>

            <a href="#">
                Contracts
            </a>

        </nav>

    </div>

</header>



<main class="container">


    <div class="breadcrumb">

        <a href="index.html">
            Home
        </a>

        /

        Token

    </div>



    <div
        id="tokenContainer">

        <div class="loading">

            Loading token...

        </div>

    </div>


</main>



<footer>

    Base Explorer © 2026

</footer>



<script>


/* =========================================
   CONFIG
========================================= */

const BLOCKSCOUT_API =
    "https://base.blockscout.com/api/v2";


/* =========================================
   GET TOKEN ADDRESS
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const tokenAddress =
    params.get("address");


/* =========================================
   VALIDATE ADDRESS
========================================= */

function isValidAddress(value) {

    return /^0x[a-fA-F0-9]{40}$/
        .test(value);

}


/* =========================================
   SHORT ADDRESS
========================================= */

function shortAddress(value) {

    if (!value) {
        return "-";
    }

    return (
        value.substring(0, 10)
        + "..."
        + value.substring(
            value.length - 8
        )
    );

}


/* =========================================
   FORMAT TOKEN AMOUNT
========================================= */

function formatTokenAmount(
    value,
    decimals
) {

    try {

        const number =
            Number(value) /
            Math.pow(
                10,
                decimals
            );

        return number.toLocaleString(
            undefined,
            {
                maximumFractionDigits: 6
            }
        );

    } catch {

        return "-";

    }

}


/* =========================================
   LOAD TOKEN
========================================= */

async function loadToken() {

    const container =
        document.getElementById(
            "tokenContainer"
        );


    if (
        !tokenAddress ||
        !isValidAddress(tokenAddress)
    ) {

        container.innerHTML = `

            <div class="error">

                Invalid token address.

            </div>

        `;

        return;

    }


    try {

        const response =
            await fetch(

                BLOCKSCOUT_API
                + "/tokens/"
                + tokenAddress

            );


        if (!response.ok) {

            throw new Error(
                "Token not found"
            );

        }


        const token =
            await response.json();


        displayToken(token);


    } catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="error">

                Unable to load token information.

                <br><br>

                Make sure this address is an
                ERC-20 token contract.

            </div>

        `;

    }

}


/* =========================================
   DISPLAY TOKEN
========================================= */

function displayToken(token) {

    const container =
        document.getElementById(
            "tokenContainer"
        );


    const name =
        token.name ||
        "Unknown Token";


    const symbol =
        token.symbol ||
        "-";


    const decimals =
        Number(
            token.decimals ?? 18
        );


    const totalSupply =
        token.total_supply
            ? formatTokenAmount(
                token.total_supply,
                decimals
              )
            : "-";


    const type =
        token.type ||
        "ERC-20";


    const iconLetter =
        symbol !== "-"
            ? symbol
                .substring(0, 1)
                .toUpperCase()
            : "T";


    container.innerHTML = `

        <div class="card">

            <div class="card-body">

                <div class="token-header">

                    <div class="token-icon">

                        ${iconLetter}

                    </div>


                    <div>

                        <div class="token-name">

                            ${escapeHTML(name)}

                        </div>


                        <div class="token-symbol">

                            ${escapeHTML(symbol)}

                        </div>

                    </div>

                </div>


                <div class="network-badge">

                    ● Base Mainnet

                </div>

            </div>

        </div>



        <div class="stats">


            <div class="stat">

                <div class="stat-label">

                    Token Symbol

                </div>

                <div class="stat-value">

                    ${escapeHTML(symbol)}

                </div>

            </div>


            <div class="stat">

                <div class="stat-label">

                    Decimals

                </div>

                <div class="stat-value">

                    ${decimals}

                </div>

            </div>


            <div class="stat">

                <div class="stat-label">

                    Total Supply

                </div>

                <div class="stat-value">

                    ${totalSupply}

                </div>

            </div>


        </div>



        <div class="card">

            <div class="card-header">

                Token Information

            </div>


            <div class="details">


                <div class="detail-label">

                    Contract

                </div>

                <div class="detail-value">

                    <a
                        href="address.html?address=${tokenAddress}">

                        ${tokenAddress}

                    </a>

                </div>


                <div class="detail-label">

                    Token Name

                </div>

                <div class="detail-value">

                    ${escapeHTML(name)}

                </div>


                <div class="detail-label">

                    Symbol

                </div>

                <div class="detail-value">

                    ${escapeHTML(symbol)}

                </div>


                <div class="detail-label">

                    Decimals

                </div>

                <div class="detail-value">

                    ${decimals}

                </div>


                <div class="detail-label">

                    Total Supply

                </div>

                <div class="detail-value">

                    ${totalSupply}

                </div>


                <div class="detail-label">

                    Token Type

                </div>

                <div class="detail-value">

                    ${escapeHTML(type)}

                </div>


            </div>

        </div>




        <!-- TOKEN HOLDERS -->

        <div class="card">

            <div class="card-header">

                <span>
                    Token Holders
                </span>

                <span
                    class="holder-count"
                    id="holderCount">
                    Loading...
                </span>

            </div>

            <div
                id="holders">

                <div class="loading">

                    Loading token holders...

                </div>

            </div>

        </div>




        <div class="card">

            <div class="card-header">

                Token Transfers

            </div>


            <div
                id="transfers">

                <div class="loading">

                    Loading token transfers...

                </div>

            </div>

        </div>



        


        <div class="card">

            <div class="card-header">

                Explorer Links

            </div>


            <div class="card-body">

                <a
                    class="external-link"
                    href="https://basescan.org/token/${tokenAddress}"
                    target="_blank">

                    View on BaseScan →

                </a>

            </div>

        </div>

    `;


    loadHolders(decimals);
    loadTransfers(decimals);

}




    /* =========================================
       TOKEN HOLDERS
    ========================================= */
    
    async function loadHolders(decimals) {
    
        const container =
            document.getElementById(
                "holders"
            );
    
        const countElement =
            document.getElementById(
                "holderCount"
            );
    
        try {
    
            const response =
                await fetch(
    
                    BLOCKSCOUT_API +
                    "/tokens/" +
                    tokenAddress +
                    "/holders"
    
                );
    
            if (!response.ok) {
    
                throw new Error(
                    "Holders unavailable"
                );
    
            }
    
            const data =
                await response.json();
    
            console.log(
                "Token holders:",
                data
            );
    
            const holders =
                data.items || [];
    
            if (
                holders.length === 0
            ) {
    
                countElement.textContent =
                    "0 shown";
    
                container.innerHTML = `
    
                    <div class="empty">
    
                        No token holders found.
    
                    </div>
    
                `;
    
                return;
    
            }
    
            countElement.textContent =
                holders.length +
                " shown";
    
            let html = `
    
                <div class="holders-table">
    
                    <div
                        class="holders-row holders-header">
    
                        <div>
                            #
                        </div>
    
                        <div>
                            Address
                        </div>
    
                        <div>
                            Balance
                        </div>
    
                    </div>
    
            `;
    
    
            holders.forEach(
                (holder, index) => {
    
                    const address =
                        holder.address?.hash ||
                        holder.address ||
                        "";
    
                    const value =
                        holder.value ||
                        "0";
    
                    const balance =
                        formatTokenAmount(
                            value,
                            decimals
                        );
    
    
                    html += `
    
                        <div class="holders-row">
    
                            <div
                                class="holder-rank">
    
                                ${index + 1}
    
                            </div>
    
    
                            <div
                                class="holder-address"
                                onclick="openHolderAddress('${address}')">
    
                                ${shortAddress(address)}
    
                            </div>
    
    
                            <div
                                class="holder-balance">
    
                                ${balance}
    
                            </div>
    
                        </div>
    
                    `;
    
                }
            );
    
    
            html += `
    
                </div>
    
            `;
    
    
            container.innerHTML =
                html;
    
    
        } catch (error) {
    
            console.error(
                "Token holders error:",
                error
            );
    
            countElement.textContent =
                "Unavailable";
    
            container.innerHTML = `
    
                <div class="empty">
    
                    Unable to load token holders.
    
                </div>
    
            `;
    
        }
    
    }





    /* =========================================
       OPEN HOLDER ADDRESS
    ========================================= */
    
    function openHolderAddress(address) {
    
        if (!address) {
    
            return;
    
        }
    
        window.location.href =
            "address.html?address=" +
            encodeURIComponent(address);
    
    }
    


/* =========================================
   TOKEN TRANSFERS
========================================= */

async function loadTransfers(decimals) {

    const container =
        document.getElementById(
            "transfers"
        );


    try {

        const response =
            await fetch(

                BLOCKSCOUT_API
                + "/tokens/"
                + tokenAddress
                + "/transfers"

            );


        if (!response.ok) {

            throw new Error(
                "Transfers unavailable"
            );

        }


        const data =
            await response.json();


        const transfers =
            data.items || [];


        if (
            transfers.length === 0
        ) {

            container.innerHTML = `

                <div class="empty">

                    No token transfers found.

                </div>

            `;

            return;

        }


        let html = `

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Transaction
                            </th>

                            <th>
                                From
                            </th>

                            <th>
                                To
                            </th>

                            <th>
                                Amount
                            </th>

                            <th>
                                Block
                            </th>

                        </tr>

                    </thead>

                    <tbody>

        `;


        transfers.forEach(
            transfer => {

                const hash =
                    transfer.tx_hash ||
                    transfer.transaction_hash ||
                    transfer.transaction?.hash ||
                    "";


                const from =
                    transfer.from?.hash ||
                    "-";


                const to =
                    transfer.to?.hash ||
                    "-";


                const amount =
                    transfer.total?.value ||
                    transfer.value ||
                    "0";


                const block =
                    transfer.block_number ||
                    "-";


                html += `

                    <tr>

                        <td>

                            <a
                                href="tx.html?hash=${hash}">

                                ${shortAddress(hash)}

                            </a>

                        </td>


                        <td>

                            <a
                                href="address.html?address=${from}">

                                ${shortAddress(from)}

                            </a>

                        </td>


                        <td>

                            <a
                                href="address.html?address=${to}">

                                ${shortAddress(to)}

                            </a>

                        </td>


                        <td>

                            ${formatTokenAmount(
                                amount,
                                decimals
                            )}

                        </td>


                        <td>

                            ${block}

                        </td>

                    </tr>

                `;

            }
        );


        html += `

                    </tbody>

                </table>

            </div>

        `;


        container.innerHTML =
            html;


    } catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="empty">

                Unable to load token transfers.

            </div>

        `;

    }

}


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================
   START
========================================= */

loadToken();


</script>


</body>

</html>
