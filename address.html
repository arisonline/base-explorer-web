<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Address | Base Explorer</title>

    <meta
        name="description"
        content="View Base Mainnet address balance, transaction history and contract information."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <link rel="stylesheet" href="global.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f8fafc;

            color: #111827;

            line-height: 1.5;

        }


        /* =================================================
           PAGE CONTAINER
        ================================================= */

        .container {

            width:
                min(1240px, 94%);

            margin:
                0 auto 60px;

        }


        /* =================================================
           BREADCRUMB
        ================================================= */

        .breadcrumb {

            padding:
                25px 0 16px;

            color: #6b7280;

            font-size: 13px;

        }


        .breadcrumb a {

            color: #0052ff;

            text-decoration: none;

        }


        .breadcrumb a:hover {

            text-decoration: underline;

        }


        /* =================================================
           ADDRESS CARD
        ================================================= */

        .address-card {

            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 10px;

            padding: 24px;

        }


        .address-title {

            margin-bottom: 10px;

            color: #6b7280;

            font-size: 12px;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: .3px;

        }


        .address-row {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .address {

            min-width: 0;

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;

            font-size: 15px;

            word-break: break-all;

        }


        .copy-btn {

            flex-shrink: 0;

            border:
                1px solid #d1d5db;

            background: #ffffff;

            color: #374151;

            padding:
                7px 12px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 12px;

            font-weight: 600;

        }


        .copy-btn:hover {

            background: #f3f4f6;

        }


        .network-badge {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            margin-top: 14px;

            padding:
                5px 9px;

            background: #ecfdf5;

            color: #15803d;

            border-radius: 999px;

            font-size: 11px;

            font-weight: 600;

        }


        /* =================================================
           STATS
        ================================================= */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 16px;

            margin-top: 18px;

        }


        .stat {

            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 10px;

            padding: 20px;

        }


        .stat-label {

            margin-bottom: 7px;

            color: #6b7280;

            font-size: 12px;

        }


        .stat-value {

            color: #111827;

            font-size: 20px;

            font-weight: 700;

            word-break: break-word;

        }


        /* =================================================
           SECTIONS
        ================================================= */

        .section {

            margin-top: 18px;

            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 10px;

            overflow: hidden;

        }


        .section-header {

            min-height: 55px;

            padding:
                0 18px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border-bottom:
                1px solid #eef0f3;

        }


        .section-header h2 {

            font-size: 15px;

            font-weight: 700;

        }


        .section-subtitle {

            color: #9ca3af;

            font-size: 11px;

        }


        /* =================================================
           TABLE
        ================================================= */

        .table-wrapper {

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

        }


        th,
        td {

            padding:
                13px 18px;

            text-align: left;

            border-bottom:
                1px solid #f0f1f3;

            font-size: 12px;

            white-space: nowrap;

        }


        th {

            background: #fafafa;

            color: #6b7280;

            font-size: 11px;

            font-weight: 600;

        }


        tbody tr:hover {

            background: #f8faff;

        }


        td a {

            color: #0052ff;

            text-decoration: none;

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;

        }


        td a:hover {

            text-decoration: underline;

        }


        .status {

            color: #16a34a;

            font-weight: 600;

        }


        .failed {

            color: #dc2626;

            font-weight: 600;

        }


        /* =================================================
           EMPTY / LOADING
        ================================================= */

        .empty {

            padding: 45px 20px;

            text-align: center;

            color: #9ca3af;

            font-size: 13px;

        }


        .loading {

            color: #9ca3af;

        }


        /* =================================================
           EXTERNAL LINK
        ================================================= */

        .explorer-link {

            display: inline-block;

            margin: 20px;

            padding:
                9px 13px;

            background: #0052ff;

            color: #ffffff;

            border-radius: 7px;

            text-decoration: none;

            font-size: 12px;

            font-weight: 600;

        }


        .explorer-link:hover {

            background: #0047df;

        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 768px) {

            .container {

                width: 94%;

            }


            .breadcrumb {

                padding-top: 18px;

            }


            .address-card {

                padding: 18px;

            }


            .address-row {

                align-items: flex-start;

                flex-direction: column;

            }


            .address {

                font-size: 13px;

            }


            .stats {

                grid-template-columns: 1fr;

            }


            .stat-value {

                font-size: 18px;

            }


            th,
            td {

                padding:
                    12px 14px;

                font-size: 11px;

            }

        }

    </style>

</head>


<body>


<div id="siteHeader"></div>



<main class="container">


    <!-- =================================================
         BREADCRUMB
    ================================================= -->

    <div class="breadcrumb">

        <a href="index.html">
            Home
        </a>

        /

        Address

    </div>


    <!-- =================================================
         ADDRESS
    ================================================= -->

    <div class="address-card">

        <div class="address-title">
            Address
        </div>


        <div class="address-row">

            <div
                class="address"
                id="address"
            >
                Loading...
            </div>


            <button
                class="copy-btn"
                onclick="copyAddress()"
            >
                Copy
            </button>

        </div>


        <div class="network-badge">

            ● Base Mainnet

        </div>

    </div>


    <!-- =================================================
         STATS
    ================================================= -->

    <div class="stats">


        <div class="stat">

            <div class="stat-label">
                ETH Balance
            </div>

            <div
                class="stat-value"
                id="balance"
            >
                Loading...
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Address Type
            </div>

            <div
                class="stat-value"
                id="addressType"
            >
                Detecting...
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Network
            </div>

            <div class="stat-value">
                Base Mainnet
            </div>

        </div>


    </div>


    <!-- =================================================
         TRANSACTIONS
    ================================================= -->

    <section class="section">


        <div class="section-header">

            <h2>
                Recent Transactions
            </h2>

            <span
                class="section-subtitle"
            >
                Base Mainnet
            </span>

        </div>


        <div id="transactions">

            <div class="empty loading">

                Loading blockchain data...

            </div>

        </div>


    </section>


    <!-- =================================================
         EXPLORER LINK
    ================================================= -->

    <section class="section">


        <div class="section-header">

            <h2>
                Explorer Links
            </h2>

        </div>


        <a
            id="basescanLink"
            class="explorer-link"
            href="#"
            target="_blank"
            rel="noopener"
        >

            View on BaseScan →

        </a>

    </section>


</main>



<div id="siteFooter"></div>


    
<script src="site.js"></script>

<script>


/* =========================================
   BASE CONFIGURATION
========================================= */





const BASE_CHAIN_ID =
    8453;




/* =========================================
   GET ADDRESS FROM URL
========================================= */


const params =
    new URLSearchParams(
        window.location.search
    );


const address =
    params.get("address");



/* =========================================
   VALIDATE ADDRESS
========================================= */


function isValidAddress(value) {

    return /^0x[a-fA-F0-9]{40}$/
        .test(value);

}



/* =========================================
   DISPLAY ADDRESS
========================================= */


if (
    !address ||
    !isValidAddress(address)
) {

    document.getElementById(
        "address"
    ).textContent =
        "Invalid address";

} else {

    document.getElementById(
        "address"
    ).textContent =
        address;

    loadAddress();

}



/* =========================================
   LOAD ADDRESS
========================================= */


async function loadAddress() {

    try {

        await loadBalance();

        await detectAddressType();

        setBaseScanLink();

        loadTransactions();

    } catch (error) {

        console.error(error);

    }

}



/* =========================================
   BALANCE
========================================= */


async function loadBalance() {

    const result =
        await baseRPC(

            "eth_getBalance",

            [
                address,
                "latest"
            ]

        );


    if (!result.result) {

        document.getElementById(
            "balance"
        ).textContent =
            "Unavailable";

        return;

    }


    const wei =
        BigInt(
            result.result
        );


    const eth =
        Number(wei) /
        1e18;


    document.getElementById(
        "balance"
    ).textContent =
        eth.toLocaleString(
            undefined,
            {
                maximumFractionDigits: 6
            }
        ) + " ETH";

}



/* =========================================
   DETECT ADDRESS TYPE
========================================= */


async function detectAddressType() {

    const result =
        await baseRPC(

            "eth_getCode",

            [
                address,
                "latest"
            ]

        );


    if (
        result.result &&
        result.result !== "0x"
    ) {

        document.getElementById(
            "addressType"
        ).textContent =
            "Contract";

    } else {

        document.getElementById(
            "addressType"
        ).textContent =
            "EOA";

    }

}



/* =========================================
   BASESCAN
========================================= */


function setBaseScanLink() {

    document.getElementById(
        "basescanLink"
    ).href =
        "https://basescan.org/address/"
        + address;

}



/* =========================================
   COPY ADDRESS
========================================= */


async function copyAddress() {

    await navigator.clipboard
        .writeText(address);

    alert(
        "Address copied!"
    );

}






/* =========================================
   SHORT HASH
========================================= */

function shortHash(hash) {

    if (!hash) {
        return "-";
    }

    return (
        hash.substring(0, 10)
        + "..."
        + hash.substring(hash.length - 8)
    );

}

    


/* =========================================
   TRANSACTION HISTORY
========================================= */

async function loadTransactions() {

    const container =
        document.getElementById("transactions");

    container.innerHTML = `
        <div class="empty loading">
            Loading transactions...
        </div>
    `;

    try {

        const apiURL =
            "https://base.blockscout.com/api/v2/addresses/"
            + address
            + "/transactions";

        const response =
            await fetch(apiURL);

        if (!response.ok) {
            throw new Error(
                "Transaction API request failed"
            );
        }

        const data =
            await response.json();

        const transactions =
            data.items || [];

        if (transactions.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    No transactions found.
                </div>
            `;

            return;
        }

        let html = `

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Transaction
                            </th>

                            <th>
                                Block
                            </th>

                            <th>
                                From
                            </th>

                            <th>
                                To
                            </th>

                            <th>
                                Value
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Time
                            </th>

                        </tr>

                    </thead>

                    <tbody>
        `;


        transactions.forEach(tx => {

            const hash =
                tx.hash || "";

            const blockNumber =
                tx.block_number || "-";

            const from =
                tx.from?.hash || "-";

            const to =
                tx.to?.hash || "-";

            const valueWei =
                tx.value || "0";

            const valueETH =
                Number(valueWei) / 1e18;

            const status =
                tx.status === "ok"
                    ? "Success"
                    : "Failed";

            const timestamp =
                tx.timestamp
                    ? new Date(
                        tx.timestamp
                      ).toLocaleString()
                    : "-";


            html += `

                <tr>

                    <td>

                        <a
                            href="tx.html?hash=${hash}"
                            title="${hash}"
                        >

                            ${shortHash(hash)}

                        </a>

                    </td>


                    <td>

                        ${blockNumber}

                    </td>


                    <td>

                        <a
                            href="address.html?address=${from}"
                            title="${from}"
                        >

                            ${shortHash(from)}

                        </a>

                    </td>


                    <td>

                        <a
                            href="address.html?address=${to}"
                            title="${to}"
                        >

                            ${shortHash(to)}

                        </a>

                    </td>


                    <td>

                        ${valueETH.toFixed(6)}
                        ETH

                    </td>


                    <td>

                        <span
                            class="${status === "Success"
                                ? "status"
                                : ""}"
                        >

                            ${status}

                        </span>

                    </td>


                    <td>

                        ${timestamp}

                    </td>

                </tr>

            `;

        });


        html += `

                    </tbody>

                </table>

            </div>

        `;


        container.innerHTML = html;


    } catch (error) {

        console.error(
            "Transaction loading error:",
            error
        );

        container.innerHTML = `

            <div class="empty">

                Unable to load transactions.

                <br><br>

                Please try again later.

            </div>

        `;

    }

}


</script>


</body>

</html>
