<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Explorer</title>
</head>
<body>
    <div id="spa-loader" style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#64748b;">
        Loading Base Explorer...
    </div>

    <script>
    (async function () {
        const root = "/crypto/base-scan/";
        const path = location.pathname.replace(/\/+$/, "");
        const VERSION = "?v=20261012-4";

        const collectionRoutes = {
            [root.slice(0, -1) + "/blocks"]: root + "blocks/index.html",
            [root.slice(0, -1) + "/transactions"]: root + "transactions/index.html",
            [root.slice(0, -1) + "/addresses"]: root + "addresses/index.html",
            [root.slice(0, -1) + "/tokens"]: root + "tokens/index.html",
            [root.slice(0, -1) + "/contracts"]: root + "contracts/index.html"
        };

        if (!location.pathname.startsWith(root)) {
            document.getElementById("spa-loader").textContent = "404 Page not found.";
            return;
        }

        if (location.pathname !== root && !location.pathname.endsWith("/")) {
            location.replace(location.pathname + "/" + location.search + location.hash);
            return;
        }

        const target = collectionRoutes[path] || root + "index.html";

        try {
            const response = await fetch(target, { cache: "no-store" });
            if (!response.ok) throw new Error("Unable to load Base Scan shell");

            const html = await response.text();
            const parsed = new DOMParser().parseFromString(html, "text/html");
            const baseElement = parsed.createElement("base");
            baseElement.href = new URL(root, location.origin).href;
            parsed.head.prepend(baseElement);

            document.title = parsed.title;
            document.head.innerHTML = parsed.head.innerHTML;
            document.body.innerHTML = parsed.body.innerHTML;

            const scripts = Array.from(parsed.querySelectorAll("script"));
            for (const oldScript of scripts) {
                const script = document.createElement("script");
                for (const attr of oldScript.attributes) script.setAttribute(attr.name, attr.value);
                if (oldScript.src) {
                    script.src = oldScript.src.startsWith("/")
                        ? oldScript.src.split("?")[0] + VERSION
                        : oldScript.src;
                    script.async = false;
                } else {
                    script.textContent = oldScript.textContent;
                }
                document.body.appendChild(script);
            }

            document.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
                const href = link.getAttribute("href");
                if (href && href.startsWith("/crypto/base-scan/")) {
                    link.setAttribute("href", href.split("?")[0] + VERSION);
                }
            });

            // Remove the cache-busting query after the correct shell has loaded.
            if (location.search) {
                history.replaceState({}, "", location.pathname + location.hash);
            }
        } catch (error) {
            console.error("Base Scan 404 fallback error:", error);
            document.body.innerHTML = `
                <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#64748b;padding:24px;text-align:center;">
                    Unable to load Base Scan. Please refresh the page.
                </div>
            `;
        }
    })();
    </script>
</body>
</html>
