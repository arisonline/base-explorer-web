<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Explorer</title>
</head>
<body>
    <div id="spa-loader" style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#64748b;">
        Loading Base Explorer...
    </div>

    <script>
    (async function () {
        const basePath = "/crypto/base-scan/";

        if (!location.pathname.startsWith(basePath)) {
            return;
        }

        try {
            const response = await fetch(basePath + "index.html", {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error("Unable to load Base Explorer shell");
            }

            const html = await response.text();
            const parsed = new DOMParser().parseFromString(html, "text/html");

            // Detail URLs are served by GitHub Pages through 404.html.
            // Force all relative Explorer assets/links to resolve from the
            // Explorer root instead of the current /block/... or /tx/... path.
            const baseElement = parsed.createElement("base");
            baseElement.href = new URL(basePath, location.origin).href;
            parsed.head.prepend(baseElement);

            document.title = parsed.title;
            document.head.innerHTML = parsed.head.innerHTML;
            document.body.innerHTML = parsed.body.innerHTML;

            const script = document.createElement("script");
            script.src = basePath + "site.js";
            document.body.appendChild(script);
        } catch (error) {
            console.error("Base Explorer 404 fallback error:", error);
            document.body.innerHTML = `
                <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#64748b;padding:24px;text-align:center;">
                    Unable to load Base Explorer. Please refresh the page.
                </div>
            `;
        }
    })();
    </script>
</body>
</html>
