<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Base Scan</title>
</head>
<body>
<div id="loader" style="min-height:100vh;display:grid;place-items:center;font:14px system-ui;color:#64748b">Loading Base Scan...</div>
<script>
(async () => {
    const root = '/crypto/base-scan/';
    const path = location.pathname.replace(/\/+$/, '');
    const pages = {
        [root.slice(0,-1) + '/blocks']: root + 'blocks/index.html',
        [root.slice(0,-1) + '/transactions']: root + 'transactions/index.html',
        [root.slice(0,-1) + '/addresses']: root + 'addresses/index.html',
        [root.slice(0,-1) + '/tokens']: root + 'tokens/index.html',
        [root.slice(0,-1) + '/contracts']: root + 'contracts/index.html'
    };
    const target = pages[path] || root + 'index.html';
    try {
        const response = await fetch(target + '?fallback=' + Date.now(), { cache:'no-store' });
        if (!response.ok) throw new Error('Load failed');
        const html = await response.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const base = doc.createElement('base');
        base.href = new URL(root, location.origin).href;
        doc.head.prepend(base);
        document.title = doc.title;
        document.head.innerHTML = doc.head.innerHTML;
        document.body.innerHTML = doc.body.innerHTML;
        for (const oldScript of doc.querySelectorAll('script')) {
            const script = document.createElement('script');
            for (const attr of oldScript.attributes) script.setAttribute(attr.name, attr.value);
            if (oldScript.src) script.src = oldScript.src;
            else script.textContent = oldScript.textContent;
            document.body.appendChild(script);
        }
    } catch (error) {
        console.error(error);
        document.getElementById('loader').textContent = 'Unable to load Base Scan. Please refresh.';
    }
})();
</script>
</body>
</html>
