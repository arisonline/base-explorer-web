<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Base Explorer — Base Mainnet Blockchain Explorer</title>

    <meta
        name="description"
        content="Explore Base Mainnet blocks, transactions, addresses, tokens and smart contracts with Base Explorer."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <link
        rel="canonical"
        href="https://arisonline.github.io/base-explorer-web/"
    >


    <link rel="stylesheet" href="global.css">
    <style>

        /* =================================================
           RESET
        ================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f8fafc;

            color: #111827;

            line-height: 1.5;

        }


        a {
            color: inherit;
        }


        button,
        input {
            font: inherit;
        }


        /* =================================================
           UNIVERSAL HEADER
        ================================================= */

        .site-header {

            background: #ffffff;

            border-bottom:
                1px solid #e5e7eb;

            position: sticky;

            top: 0;

            z-index: 100;

        }


        .site-header-inner {

            width:
                min(1240px, 94%);

            min-height: 68px;

            margin: auto;

            display: flex;

            align-items: center;

            gap: 28px;

        }


        .site-logo {

            display: flex;

            align-items: center;

            gap: 9px;

            text-decoration: none;

            color: #111827;

            font-size: 18px;

            font-weight: 700;

            white-space: nowrap;

        }


        .site-logo-icon {

            width: 34px;

            height: 34px;

            border-radius: 9px;

            background: #0052ff;

            color: #ffffff;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            font-size: 17px;

            font-weight: 800;

        }


        .site-nav {

            display: flex;

            align-items: center;

            gap: 22px;

            margin-right: auto;

        }


        .site-nav a {

            text-decoration: none;

            color: #4b5563;

            font-size: 14px;

            font-weight: 500;

            transition: color 0.15s ease;

        }


        .site-nav a:hover {

            color: #0052ff;

        }


        /* =================================================
           HEADER SEARCH
        ================================================= */

        .header-actions {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .header-search {

            width: 310px;

            height: 40px;

            display: flex;

            align-items: center;

            gap: 7px;

            background: #f8fafc;

            border:
                1px solid #dbe1ea;

            border-radius: 8px;

            padding-left: 11px;

        }


        .search-icon {

            color: #9ca3af;

            font-size: 19px;

            line-height: 1;

        }


        .header-search input {

            min-width: 0;

            flex: 1;

            border: 0;

            outline: 0;

            background: transparent;

            color: #111827;

            font-size: 13px;

        }


        .header-search input::placeholder {

            color: #9ca3af;

        }


        .header-search button {

            height: 32px;

            margin-right: 4px;

            padding: 0 12px;

            border: 0;

            border-radius: 6px;

            background: #0052ff;

            color: #ffffff;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;

        }


        .header-search button:hover {

            background: #0047df;

        }


        .mobile-menu-button {

            display: none;

            border: 0;

            background: transparent;

            font-size: 23px;

            cursor: pointer;

        }


        .mobile-navigation {

            display: none;

        }


        /* =================================================
           HERO
        ================================================= */

        .hero {

            background:
                linear-gradient(
                    180deg,
                    #eef4ff 0%,
                    #f8fafc 100%
                );

            border-bottom:
                1px solid #e7edf5;

            padding:
                68px 20px 74px;

        }


        .hero-inner {

            width:
                min(900px, 94%);

            margin: auto;

            text-align: center;

        }


        .hero-badge {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding:
                6px 11px;

            background: #ffffff;

            border:
                1px solid #dbe5f5;

            border-radius: 999px;

            color: #374151;

            font-size: 12px;

            font-weight: 600;

            margin-bottom: 18px;

        }


        .status-dot {

            width: 7px;

            height: 7px;

            border-radius: 50%;

            background: #16a34a;

        }


        .hero h1 {

            font-size:
                clamp(32px, 5vw, 48px);

            line-height: 1.1;

            letter-spacing: -1.5px;

            margin-bottom: 15px;

            color: #111827;

        }


        .hero p {

            max-width: 650px;

            margin:
                0 auto 28px;

            color: #6b7280;

            font-size: 16px;

        }


        .hero-search {

            width:
                min(760px, 100%);

            height: 58px;

            margin: auto;

            display: flex;

            align-items: center;

            padding: 5px;

            background: #ffffff;

            border:
                1px solid #d8e0ec;

            border-radius: 11px;

            box-shadow:
                0 12px 35px rgba(15, 23, 42, 0.08);

        }


        .hero-search input {

            flex: 1;

            min-width: 0;

            height: 100%;

            padding:
                0 15px;

            border: 0;

            outline: 0;

            color: #111827;

            font-size: 14px;

        }


        .hero-search input::placeholder {

            color: #9ca3af;

        }


        .hero-search button {

            height: 48px;

            padding:
                0 23px;

            border: 0;

            border-radius: 8px;

            background: #0052ff;

            color: #ffffff;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

        }


        .hero-search button:hover {

            background: #0047df;

        }


        .hero-network {

            margin-top: 16px;

            color: #6b7280;

            font-size: 12px;

        }


        .hero-network strong {

            color: #15803d;

        }


        /* =================================================
           MAIN CONTAINER
        ================================================= */

        .container {

            width:
                min(1240px, 94%);

            margin: auto;

        }


        /* =================================================
           NETWORK STATS
        ================================================= */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 16px;

            margin-top: -28px;

            position: relative;

            z-index: 2;

        }


        .stat-card {

            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 10px;

            padding: 20px;

            box-shadow:
                0 4px 18px rgba(15, 23, 42, 0.04);

        }


        .stat-top {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 8px;

        }


        .stat-title {

            color: #6b7280;

            font-size: 12px;

            font-weight: 500;

        }


        .stat-icon {

            width: 30px;

            height: 30px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 7px;

            background: #eef4ff;

            color: #0052ff;

            font-size: 13px;

            font-weight: 700;

        }


        .stat-value {

            font-size: 21px;

            font-weight: 700;

            color: #111827;

        }


        .stat-sub {

            margin-top: 3px;

            color: #9ca3af;

            font-size: 11px;

        }


        /* =================================================
           CONTENT
        ================================================= */

        .content {

            padding:
                32px 0 65px;

        }


        .section-title {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 13px;

        }


        .section-title h2 {

            font-size: 17px;

            letter-spacing: -0.2px;

        }


        .section-title span {

            color: #9ca3af;

            font-size: 12px;

        }


        .columns {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 18px;

        }


        /* =================================================
           CARDS
        ================================================= */

        .card {

            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 10px;

            overflow: hidden;

        }


        .card-header {

            min-height: 56px;

            padding:
                0 18px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border-bottom:
                1px solid #eef0f3;

        }


        .card-header h2 {

            font-size: 15px;

            font-weight: 700;

        }


        .view-all {

            color: #0052ff;

            text-decoration: none;

            font-size: 12px;

            font-weight: 600;

        }


        .view-all:hover {

            text-decoration: underline;

        }


        /* =================================================
           BLOCK / TRANSACTION LIST
        ================================================= */

        .list {

            min-height: 300px;

        }


        .list-item {

            min-height: 60px;

            padding:
                11px 18px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            border-bottom:
                1px solid #f0f1f3;

            transition:
                background 0.12s ease;

        }


        .list-item:last-child {

            border-bottom: 0;

        }


        .list-item.clickable {

            cursor: pointer;

        }


        .list-item.clickable:hover {

            background: #f8faff;

        }


        .item-main {

            min-width: 0;

            display: flex;

            flex-direction: column;

            gap: 3px;

        }


        .item-title {

            color: #0052ff;

            font-size: 13px;

            font-weight: 600;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        .item-sub {

            color: #9ca3af;

            font-size: 11px;

        }


        .item-value {

            flex-shrink: 0;

            color: #374151;

            font-size: 12px;

            font-weight: 600;

        }


        /* =================================================
           LOADING
        ================================================= */

        .loading-item {

            min-height: 300px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #9ca3af;

            font-size: 13px;

        }


        /* =================================================
           FOOTER
        ================================================= */

        .site-footer {

            background: #ffffff;

            border-top:
                1px solid #e5e7eb;

        }


        .footer-inner {

            width:
                min(1240px, 94%);

            margin: auto;

            padding:
                42px 0;

            display: grid;

            grid-template-columns:
                2fr 1fr 1fr 1fr;

            gap: 30px;

        }


        .footer-logo {

            display: flex;

            align-items: center;

            gap: 9px;

            margin-bottom: 10px;

        }


        .footer-brand p {

            max-width: 250px;

            color: #9ca3af;

            font-size: 12px;

        }


        .footer-column {

            display: flex;

            flex-direction: column;

            gap: 8px;

        }


        .footer-column h3 {

            margin-bottom: 5px;

            font-size: 12px;

            color: #374151;

        }


        .footer-column a {

            color: #6b7280;

            text-decoration: none;

            font-size: 12px;

        }


        .footer-column a:hover {

            color: #0052ff;

        }


        .footer-network {

            color: #9ca3af;

            font-size: 11px;

        }


        .footer-bottom {

            width:
                min(1240px, 94%);

            margin: auto;

            padding:
                16px 0;

            border-top:
                1px solid #f0f1f3;

            display: flex;

            align-items: center;

            justify-content: space-between;

            color: #9ca3af;

            font-size: 11px;

        }


        /* =================================================
           RESPONSIVE
        ================================================= */

        @media (max-width: 900px) {

            .site-nav {

                display: none;

            }


            .header-search {

                width: 250px;

            }


            .columns {

                grid-template-columns: 1fr;

            }


            .footer-inner {

                grid-template-columns:
                    1fr 1fr;

            }

        }


        @media (max-width: 650px) {

            .site-header-inner {

                min-height: 62px;

                gap: 10px;

            }


            .site-logo {

                font-size: 16px;

            }


            .site-logo-icon {

                width: 31px;

                height: 31px;

            }


            .header-search {

                display: none;

            }


            .mobile-menu-button {

                display: block;

            }


            .mobile-navigation {

                padding: 10px 3% 15px;

                border-top:
                    1px solid #f0f1f3;

                background: #ffffff;

            }


            .mobile-navigation.show {

                display: grid;

                gap: 3px;

            }


            .mobile-navigation a {

                padding: 10px;

                color: #4b5563;

                text-decoration: none;

                font-size: 14px;

                border-radius: 7px;

            }


            .mobile-navigation a:hover {

                background: #f5f8ff;

                color: #0052ff;

            }


            .hero {

                padding:
                    52px 15px 60px;

            }


            .hero h1 {

                font-size: 32px;

                letter-spacing: -1px;

            }


            .hero p {

                font-size: 14px;

            }


            .hero-search {

                height: auto;

                flex-direction: column;

                padding: 5px;

            }


            .hero-search input {

                width: 100%;

                height: 48px;

            }


            .hero-search button {

                width: 100%;

            }


            .stats {

                grid-template-columns: 1fr;

                margin-top: 18px;

            }


            .content {

                padding-top: 25px;

            }


            .footer-inner {

                grid-template-columns: 1fr;

                gap: 25px;

            }


            .footer-bottom {

                flex-direction: column;

                align-items: flex-start;

                gap: 5px;

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     UNIVERSAL HEADER
===================================================== -->

<div id="siteHeader"></div>


<main id="app"></main>

<!-- =====================================================
     UNIVERSAL FOOTER
===================================================== -->

<div id="siteFooter"></div>


<!-- =====================================================
     UNIVERSAL SITE JS
===================================================== -->

<script src="site.js"></script>


<script>

/* =========================================================
   LOAD DATA ON PAGE LOAD ONLY
   ========================================================= */

loadLatestBlock();

loadLatestBlocks();

loadLatestTransactions();


</script>


</body>

</html>
