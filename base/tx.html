<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Transaction | Base Explorer</title>

    <meta
        name="description"
        content="View Base Mainnet transaction details including status, sender, receiver, value, gas and transaction fee."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <link rel="stylesheet" href="global.css">

    <style>

        /* =================================================
           PAGE CONTAINER
        ================================================= */

        .container {
            width: min(1240px, 94%);
            margin: 0 auto 60px;
        }


        /* =================================================
           BREADCRUMB
        ================================================= */

        .breadcrumb {
            padding: 25px 0 16px;

            color: #6b7280;

            font-size: 13px;
        }

        .breadcrumb a {
            color: #0052ff;

            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }


        /* =================================================
           CARD
        ================================================= */

        .card {
            background: #ffffff;

            border: 1px solid #e5e7eb;

            border-radius: 10px;

            margin-bottom: 18px;

            overflow: hidden;
        }

        .card-header {
            min-height: 56px;

            padding: 0 18px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border-bottom: 1px solid #eef0f3;

            font-size: 15px;

            font-weight: 700;
        }

        .card-body {
            padding: 20px;
        }


        /* =================================================
           TRANSACTION HASH
        ================================================= */

        .tx-hash-label {
            margin-bottom: 8px;

            color: #6b7280;

            font-size: 12px;

            font-weight: 600;
        }

        .tx-hash-row {
            display: flex;

            align-items: flex-start;

            gap: 10px;
        }

        .tx-hash {
            min-width: 0;

            color: #111827;

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;

            font-size: 13px;

            line-height: 1.6;

            word-break: break-all;
        }


        /* =================================================
           STATUS
        ================================================= */

        .status {
            display: inline-flex;

            align-items: center;

            gap: 6px;

            padding: 5px 9px;

            border-radius: 999px;

            font-size: 11px;

            font-weight: 600;
        }

        .success {
            background: #ecfdf5;

            color: #15803d;
        }

        .failed {
            background: #fef2f2;

            color: #dc2626;
        }


        /* =================================================
           NETWORK BADGE
        ================================================= */

        .network-badge {
            display: inline-flex;

            align-items: center;

            gap: 6px;

            padding: 5px 9px;

            background: #ecfdf5;

            color: #15803d;

            border-radius: 999px;

            font-size: 11px;

            font-weight: 600;
        }


        /* =================================================
           COPY BUTTON
        ================================================= */

        .copy-btn {
            flex-shrink: 0;

            border: 1px solid #d1d5db;

            background: #ffffff;

            color: #374151;

            padding: 6px 10px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 11px;

            font-weight: 600;
        }

        .copy-btn:hover {
            background: #f3f4f6;
        }


        /* =================================================
           DETAILS
        ================================================= */

        .details {
            display: grid;

            grid-template-columns: 200px 1fr;
        }

        .detail-label {
            padding: 14px 18px;

            background: #fafafa;

            border-bottom: 1px solid #f0f1f3;

            color: #6b7280;

            font-size: 12px;

            font-weight: 500;
        }

        .detail-value {
            min-width: 0;

            padding: 14px 18px;

            border-bottom: 1px solid #f0f1f3;

            color: #111827;

            font-size: 12px;

            word-break: break-word;
        }

        .detail-value a {
            color: #0052ff;

            text-decoration: none;

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;
        }

        .detail-value a:hover {
            text-decoration: underline;
        }


        /* =================================================
           EXTERNAL LINK
        ================================================= */

        .external-link {
            display: inline-flex;

            align-items: center;

            padding: 9px 13px;

            background: #0052ff;

            color: #ffffff;

            text-decoration: none;

            border-radius: 7px;

            font-size: 12px;

            font-weight: 600;
        }

        .external-link:hover {
            background: #0047df;
        }


        /* =================================================
           LOADING / ERROR
        ================================================= */

        .loading {
            padding: 45px 20px;

            text-align: center;

            color: #9ca3af;

            font-size: 13px;
        }

        .error {
            padding: 18px;

            background: #fef2f2;

            color: #dc2626;

            border-radius: 8px;

            text-align: center;

            font-size: 13px;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 650px) {

            .container {
                width: 94%;
            }

            .breadcrumb {
                padding-top: 18px;
            }

            .card-body {
                padding: 16px;
            }

            .tx-hash-row {
                flex-direction: column;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .detail-label {
                padding: 11px 14px 4px;

                border-bottom: none;

                background: #ffffff;
            }

            .detail-value {
                padding: 4px 14px 11px;
            }

        }

    </style>

</head>


<body>


<div id="siteHeader"></div>


<main class="container">


    <!-- =================================================
         BREADCRUMB
    ================================================= -->

    <div class="breadcrumb">

        <a href="index.html">
            Home
        </a>

        /

        Transaction

    </div>


    <!-- =================================================
         TRANSACTION SUMMARY
    ================================================= -->

    <div class="card">

        <div class="card-header">

            <span>
                Transaction Details
            </span>

            <span class="network-badge">
                ● Base Mainnet
            </span>

        </div>


        <div
            class="card-body"
            id="transactionSummary"
        >

            <div class="loading">
                Loading transaction...
            </div>

        </div>

    </div>


    <!-- =================================================
         OVERVIEW
    ================================================= -->

    <div class="card">

        <div class="card-header">

            Overview

        </div>


        <div
            class="details"
            id="transactionDetails"
        >

        </div>

    </div>


    <!-- =================================================
         EXPLORER LINKS
    ================================================= -->

    <div class="card">

        <div class="card-header">

            Explorer Links

        </div>


        <div class="card-body">

            <a
                id="basescanLink"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="external-link"
            >

                View on BaseScan →

            </a>

        </div>

    </div>


</main>


<div id="siteFooter"></div>


<script src="site.js"></script>


<script>

    /* =========================================================
       CONFIG
    ========================================================= */

    const BASE_BLOCKSCOUT =
        "https://base.blockscout.com/api/v2";


    /* =========================================================
       GET HASH
    ========================================================= */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const hash =
        params.get("hash");


    /* =========================================================
       VALIDATE HASH
    ========================================================= */

    function isValidHash(value) {

        return /^0x[a-fA-F0-9]{64}$/.test(
            value || ""
        );

    }


    /* =========================================================
       SHORT HASH
    ========================================================= */

    function shortHash(value) {

        if (!value) {
            return "-";
        }

        return (
            value.substring(0, 12) +
            "..." +
            value.substring(value.length - 10)
        );

    }


    /* =========================================================
       FORMAT ETH
    ========================================================= */

    function formatETH(value) {

        try {

            const wei =
                BigInt(value || "0");

            const whole =
                wei / 1000000000000000000n;

            const fraction =
                wei % 1000000000000000000n;

            const fractionText =
                fraction
                    .toString()
                    .padStart(18, "0")
                    .substring(0, 8);

            return (
                whole.toString() +
                "." +
                fractionText +
                " ETH"
            );

        } catch {

            return "0.00000000 ETH";

        }

    }


    /* =========================================================
       FORMAT GWEI
    ========================================================= */

    function formatGwei(value) {

        try {

            const wei =
                BigInt(value || "0");

            const whole =
                wei / 1000000000n;

            const fraction =
                wei % 1000000000n;

            const fractionText =
                fraction
                    .toString()
                    .padStart(9, "0")
                    .substring(0, 4);

            return (
                whole.toString() +
                "." +
                fractionText +
                " Gwei"
            );

        } catch {

            return "-";

        }

    }


    /* =========================================================
       LOAD TRANSACTION
    ========================================================= */

    async function loadTransaction() {

        const summary =
            document.getElementById(
                "transactionSummary"
            );


        if (
            !hash ||
            !isValidHash(hash)
        ) {

            summary.innerHTML = `

                <div class="error">

                    Invalid transaction hash.

                </div>

            `;

            return;

        }


        try {

            const response =
                await fetch(
                    BASE_BLOCKSCOUT +
                    "/transactions/" +
                    encodeURIComponent(hash)
                );


            if (!response.ok) {

                throw new Error(
                    "Transaction not found"
                );

            }


            const tx =
                await response.json();


            displayTransaction(tx);


        } catch (error) {

            console.error(
                "Transaction loading error:",
                error
            );


            summary.innerHTML = `

                <div class="error">

                    Transaction could not be loaded.

                    <br><br>

                    Please check the transaction hash.

                </div>

            `;

        }

    }


    /* =========================================================
       DISPLAY TRANSACTION
    ========================================================= */

    function displayTransaction(tx) {

        const summary =
            document.getElementById(
                "transactionSummary"
            );


        const details =
            document.getElementById(
                "transactionDetails"
            );


        const status =
            tx.status === "ok"
                ? "Success"
                : "Failed";


        const statusClass =
            tx.status === "ok"
                ? "success"
                : "failed";


        const from =
            tx.from?.hash || "";


        const to =
            tx.to?.hash || "";


        const block =
            tx.block_number || "-";


        const timestamp =
            tx.timestamp
                ? new Date(
                    tx.timestamp
                ).toLocaleString()
                : "-";


        const value =
            formatETH(tx.value);


        const gasUsed =
            tx.gas_used || "-";


        const gasPrice =
            tx.gas_price
                ? formatGwei(tx.gas_price)
                : "-";


        const fee =
            tx.fee?.value
                ? formatETH(tx.fee.value)
                : "0.00000000 ETH";


        summary.innerHTML = `

            <div class="tx-hash-label">
                Transaction Hash
            </div>


            <div class="tx-hash-row">

                <div class="tx-hash">
                    ${tx.hash || hash}
                </div>


                <button
                    class="copy-btn"
                    type="button"
                    onclick="copyHash()"
                >
                    Copy
                </button>

            </div>


            <div style="margin-top:15px">

                <span class="status ${statusClass}">

                    ● ${status}

                </span>

            </div>

        `;


        details.innerHTML = `

            <div class="detail-label">
                Block
            </div>

            <div class="detail-value">

                ${block}

            </div>


            <div class="detail-label">
                Timestamp
            </div>

            <div class="detail-value">

                ${timestamp}

            </div>


            <div class="detail-label">
                From
            </div>

            <div class="detail-value">

                ${
                    from
                        ? `
                            <a href="address.html?address=${encodeURIComponent(from)}">
                                ${shortHash(from)}
                            </a>
                        `
                        : "-"
                }

            </div>


            <div class="detail-label">
                To
            </div>

            <div class="detail-value">

                ${
                    to
                        ? `
                            <a href="address.html?address=${encodeURIComponent(to)}">
                                ${shortHash(to)}
                            </a>
                        `
                        : "-"
                }

            </div>


            <div class="detail-label">
                Value
            </div>

            <div class="detail-value">

                ${value}

            </div>


            <div class="detail-label">
                Transaction Fee
            </div>

            <div class="detail-value">

                ${fee}

            </div>


            <div class="detail-label">
                Gas Used
            </div>

            <div class="detail-value">

                ${gasUsed}

            </div>


            <div class="detail-label">
                Gas Price
            </div>

            <div class="detail-value">

                ${gasPrice}

            </div>


            <div class="detail-label">
                Nonce
            </div>

            <div class="detail-value">

                ${tx.nonce ?? "-"}

            </div>


            <div class="detail-label">
                Network
            </div>

            <div class="detail-value">

                Base Mainnet

            </div>

        `;


        document.getElementById(
            "basescanLink"
        ).href =
            "https://basescan.org/tx/" +
            encodeURIComponent(
                tx.hash || hash
            );

    }


    /* =========================================================
       COPY HASH
    ========================================================= */

    async function copyHash() {

        if (!hash) {
            return;
        }


        try {

            await navigator.clipboard.writeText(
                hash
            );

            alert(
                "Transaction hash copied!"
            );

        } catch {

            alert(
                "Unable to copy hash."
            );

        }

    }


    /* =========================================================
       START
    ========================================================= */

    loadTransaction();

</script>


</body>

</html>
